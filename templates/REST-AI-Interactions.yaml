name: REST-AI-Interactions
type: template
description: API template for REST-AI-Interactions
gateway: apigee
schemaVersion: 1.0.0
features:
  - ../features/ai-endpoint-interactions.yaml
  - ../features/ai-target-gemini.yaml
  - ../features/ai-model-preprocess.yaml
  - ../features/ai-model-postprocess.yaml
parameters:
  - name: SimpleModel
    default: google/gemini-3.5-flash-lite
  - name: MediumModel
    default: google/gemini-3.7-flash
  - name: ComplexModel
    default: google/gemini-3.7-flash
  - name: ThinkingModel
    default: google/gemini-3.7-flash
  - name: ModelRouting
    default: "'google/*'=gemini"
  - name: ModelMapping
    default: gemini-flash-latest=gemini-3.7-flash,gemini-2.5-flash=gemini-3.7-flash
endpoints:
  - name: interactions
    basePath: /v1beta/interactions
    routes: []
targets:
  - name: gemini
    url: https://generativelanguage.googleapis.com/v1beta/interactions
