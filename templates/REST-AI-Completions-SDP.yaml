# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
name: REST-AI-Completions-SDP
type: template
description: API template for REST-AI-Completions with Sensitive Data Protection
gateway: apigee
schemaVersion: 1.0.0
features:
  - ../features/ai-endpoint-completions.yaml
  - ../features/ai-target-googlecloud.yaml
  - ../features/ai-model-preprocess.yaml
  - ../features/security-anonymization-sdp.yaml
  - ../features/auth-apikey-verify.yaml
  - ../features/ai-model-failover.yaml
  - ../features/ai-model-postprocess.yaml
parameters:
  - name: CompletionsBasePath
    default: /v1/chat/completions/sdp
  - name: SimpleModel
    default: google/gemini-3.5-flash-lite
  - name: MediumModel
    default: google/gemini-3.8-flash
  - name: ComplexModel
    default: google/gemini-3.8-flash
  - name: ThinkingModel
    default: anthropic/claude-opus-5
  - name: ModelRouting
    default: "'google/*'=googlecloud-oai,'anthropic/*'=googlecloud"
  - name: ModelMapping
    default: "gemini-flash-latest=gemini-3.7-flash,gemini-2.5-flash=gemini-3.7-flash"
endpoints:
  - name: completions
    basePath: /v1/chat/completions
    routes:
      - name: route-googlecloud
        target: googlecloud
        condition: target.route = "googlecloud"
      - name: route-googlecloud-oai
        target: googlecloud-oai
        condition: target.route = "googlecloud-oai"
      - name: route-openai
        target: openai
        condition: target.route = "openai"
      - name: route-anthropic
        target: anthropic
        condition: target.route = "anthropic"
      - name: default
        target: googlecloud
targets:
  - name: anthropic
    url: https://api.anthropic.com
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/endpoints/openapi/chat/completions
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
  - name: openai
    url: https://api.openai.com
