# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
name: REST-AI-Antigravity
displayName: Antigravity API
type: template
description: API template for REST-AI-Antigravity
gateway: apigee
schemaVersion: 1.0.0
features:
  - ../features/ai-endpoint-antigravity.yaml
  - ../features/ai-target-googlecloud.yaml
  - ../features/ai-model-preprocess.yaml
  - ../features/auth-apikey-verify.yaml
  - ../features/ai-model-postprocess.yaml
parameters:
  - name: SimpleModel
    default: google/gemini-3.5-flash-lite
  - name: MediumModel
    default: google/gemini-3.7-flash
  - name: ComplexModel
    default: google/gemini-3.7-flash
  - name: ThinkingModel
    default: google/gemini-3.7-flash
  - name: ModelRouting
    default: "'google/*'=googlecloud-project"
  - name: ModelMapping
    default: gemini-flash-latest=gemini-3.8-flash,gemini-2.5-flash=gemini-3.8-flash
  - name: GoogleCloudProject
    default: "{organization.name}"
endpoints:
  - name: antigravity
    basePath: /antigravity
    routes: []
  - name: models
    basePath: /antigravity/v1beta/models
    routes: []
targets:
  - name: googlecloud-project
    url: https://aiplatform.googleapis.com/v1/projects
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/endpoints/openapi/chat/completions
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
