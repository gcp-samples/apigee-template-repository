name: ai-starter-package
displayName: AI Starter Package
type: product
gateway: apigee
schemaVersion: 1.0.0
description: Starter tier for MCP & LLM Model access.
access: public
approvalType: auto
environments:
  - dev
proxies:
  - REST-Orders
  - REST-AI-Completions
  - MCP-CustomerService
apiResources: []
quota: "50000"
quotaInterval: "1"
quotaTimeUnit: month
scopes: []
operations:
  - apiSource: REST-Orders
    operations:
      - name: /json
        methods: []
    quota: {}
llmOperations:
  - apiSource: REST-AI-Completions
    operations:
      - name: /
        methods:
          - POST
        model: glm-5.2-maas
    llmTokenQuota:
      limit: "100"
      interval: "1"
      timeUnit: minute
  - apiSource: REST-AI-Completions
    operations:
      - name: /
        methods:
          - POST
        model: gemini-3.8-flash
    llmTokenQuota:
      limit: "10000"
      interval: "1"
      timeUnit: minute
  - apiSource: REST-AI-Completions
    operations:
      - name: /
        methods:
          - POST
        model: gemini-3.5-flash-lite
    llmTokenQuota: {}
  - apiSource: REST-AI-Completions
    operations:
      - name: /
        methods:
          - POST
        model: claude-sonnet-5
    llmTokenQuota:
      limit: "10000"
      interval: "1"
      timeUnit: hour
  - apiSource: REST-AI-Completions
    operations:
      - name: /
        methods:
          - POST
        model: claude-opus-5
    llmTokenQuota:
      limit: "1000"
      interval: "1"
      timeUnit: hour
payloadOperations:
  - apiSource: MCP-CustomerService
    protocol: MCP
    operations:
      - name: tools/list
  - apiSource: MCP-CustomerService
    protocol: MCP
    operations:
      - name: tools/call/customers_list
    quota:
      limit: "10"
      interval: "1"
      timeUnit: minute
graphqlOperations: []
grpcOperations: []
