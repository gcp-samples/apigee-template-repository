name: ai-premium-package
displayName: AI Premium Package
type: product
gateway: apigee
schemaVersion: 1.0.0
description: Premium tier for MCP & LLM Model access.
access: public
approvalType: auto
environments:
  - dev
proxies:
  - REST-Orders
  - REST-AI-Completions
  - MCP-CustomerService
apiResources: []
operations:
  - apiSource: REST-Orders
    operations:
      - name: /json
        methods: []
    quota: {}
llmOperations:
  - apiSource: REST-AI-Completions
    operations:
      - name: /
        methods:
          - POST
        model: gemini-3.8-flash
    llmTokenQuota:
      limit: "10000"
      interval: "1"
      timeUnit: minute
  - apiSource: REST-AI-Completions
    operations:
      - name: /
        methods:
          - POST
        model: gemini-3.5-flash-lite
    llmTokenQuota: {}
  - apiSource: REST-AI-Completions
    operations:
      - name: /
        methods:
          - POST
        model: claude-sonnet-5
  - apiSource: REST-AI-Completions
    operations:
      - name: /
        methods:
          - POST
        model: claude-opus-5
    llmTokenQuota:
      limit: "10000"
      interval: "1"
      timeUnit: hour
payloadOperations:
  - apiSource: MCP-CustomerService
    protocol: MCP
    operations:
      - name: tools/list
  - apiSource: MCP-CustomerService
    protocol: MCP
    operations:
      - name: tools/call/customers_list
    quota:
      limit: "30"
      interval: "1"
      timeUnit: minute
graphqlOperations: []
grpcOperations: []
