  - name: JS-BuildProtectedResourceMetadata
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildProtectedResourceMetadata
        DisplayName: JS-BuildProtectedResourceMetadata
        Properties: {}
        Source: |
          var authServerUrl = context.getVariable("oauth_auth_server_url");
          var resourceUrl = context.getVariable("oauth_resource_url");
          var scopesStr = context.getVariable("mcp_required_scopes") || "mcp";
          var scopes = scopesStr.split(/\s+/).filter(Boolean);
          var resourceDoc = context.getVariable("oauth_resource_doc") || (resourceUrl + "/docs");

          var authServers = [];
          if (authServerUrl) {
            authServers.push(authServerUrl);
          }

          try {
            var pStr = context.getVariable("oauth_providers_json") || "[]";
            var providers = JSON.parse(pStr);
            if (Array.isArray(providers)) {
              for (var i = 0; i < providers.length; i++) {
                if (providers[i] && providers[i].issuer && authServers.indexOf(providers[i].issuer) === -1) {
                  authServers.push(providers[i].issuer);
                }
              }
            }
          } catch (e) {}

          var metadata = {
            "resource": resourceUrl,
            "authorization_servers": authServers,
            "scopes_supported": scopes,
            "bearer_methods_supported": ["header"],
            "resource_documentation": resourceDoc
          };

          context.setVariable("response.content", JSON.stringify(metadata, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);
