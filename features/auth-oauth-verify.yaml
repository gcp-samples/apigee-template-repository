  - name: RF-Unauthorized
    type: RaiseFault
    content:
      RaiseFault:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: RF-Unauthorized
        DisplayName: RF-Unauthorized
        Properties: {}
        FaultResponse:
          Set:
            Headers:
              Header:
                - metadata:
                    name: WWW-Authenticate
                  Value: 'Bearer realm="mcp", resource_metadata="{oauth_protected_resource_url}", scope="{mcp_required_scopes}"'
                - metadata:
                    name: Content-Type
                  Value: application/json
            Payload:
              contentType: application/json
              Value: |
                {
                  "error": "unauthorized",
                  "error_description": "Authentication required. Please obtain a Bearer token from the authorization server."
                }
            StatusCode: "401"
            ReasonPhrase: Unauthorized
        IgnoreUnresolvedVariables: "true"

