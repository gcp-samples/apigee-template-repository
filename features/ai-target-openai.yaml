# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
type: feature
documentation: "https://gcp-samples.github.io/apigee-template-repository/docs/?file=features/ai-target-openai.yaml"
description: Target for OpenAI.
parameters: []
endpoints: []
defaultEndpoint:
  name: default
  routes:
  - name: route-openai
    condition: target.route = "openai"
    target: openai
targets:
  - name: openai
    url: https://api.openai.com
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: KVM-LoadCredentials
            condition: request.header.Authorization == null
          - name: AM-SetHeader
            condition: request.header.Authorization == null
    faultRules: []
policies:
  - name: KVM-LoadCredentials
    type: KeyValueMapOperations
    content:
      KeyValueMapOperations:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: KVM-LoadCredentials
          mapIdentifier: AI-Secrets
        DisplayName: KVM-LoadCredentials
        Properties: {}
        ExclusiveCache: "false"
        ExpiryTimeInSecs: "10"
        Get:
          - metadata:
              assignTo: ai.openAiKey
            Key:
              Parameter: OpenAI_Key
        Scope: environment
  - name: AM-SetHeader
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetHeader
        DisplayName: AM-SetHeader
        Properties: {}
        Set:
          Headers:
            Header:
              metadata:
                name: Authorization
              _text: "Bearer {ai.openAiKey}"
        IgnoreUnresolvedVariables: "true"
        AssignTo:
          metadata:
            createNew: "false"
            transport: http
            type: request
resources: []
tests: []
