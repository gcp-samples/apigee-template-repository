name: ai-security-modelarmor
displayName: ai-security-modelarmor
type: feature
description: ai-security-modelarmor
documentation: "https://gcp-samples.github.io/apigee-template-repository?file=features%2Fai-security-modelarmor.yaml"
gateway: apigee
schemaVersion: 1.0.0
categories: []
parameters:
  - name: GoogleCloudProject
    default: "{organization.name}"
  - name: ModelArmorTemplate
    default: "projects/{GoogleCloudProject}/locations/eu/templates/default-ma-template"
defaultEndpoint:
  name: default
  basePath: /ai-security-modelarmor
  routes:
    - name: default
      target: default
  flows:
    - name: PreFlow
      mode: Request
      steps:
        - name: SUP-SanitizePrompt
  faultRules: []
defaultTarget:
  name: default
  url: https://aiplatform.googleapis.com
  flows: []
  faultRules: []
  httpTargetConnection:
    Properties: {}
    URL: https://aiplatform.googleapis.com
endpoints: []
targets: []
policies:
  - name: SUP-SanitizePrompt
    type: SanitizeUserPrompt
    content:
      SanitizeUserPrompt:
        metadata:
          async: "false"
          continueOnError: "false"
          enabled: "true"
          name: SUP-SanitizePrompt
        IgnoreUnresolvedVariables: "false"
        DisplayName: SUP-SanitizePrompt
        ModelArmor:
          TemplateName: "{ModelArmorTemplate}"
        UserPromptSource: "{ai.requestPrompt}"
resources: []
tests: []
