# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
type: feature
documentation: "https://gcp-samples.github.io/apigee-template-repository?file=features%2Fai-target-googlecloud.yaml"
description: Proxy for Google Cloud Model Garden models.
parameters:
  - name: GoogleCloudProject
    default: "{organization.name}"
defaultEndpoint:
  name: default
  routes:
    - name: route-googlecloud
      condition: target.route = "googlecloud"
      target: googlecloud
    - name: route-googlecloud-oai
      condition: target.route = "googlecloud-oai"
      target: googlecloud-oai
    - name: route-googlecloud-project
      condition: target.route = "googlecloud-project"
      target: googlecloud-project
    - name: default
      target: googlecloud
endpoints: []
targets:
  - name: googlecloud-project
    url: https://aiplatform.googleapis.com/v1/projects
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: JS-SetTargetUrl
            condition: proxy.url !~~ ".*/projects/.*"
    faultRules: []
    httpTargetConnection:
      Properties: {}
      URL: https://aiplatform.googleapis.com/v1/projects
      Authentication:
        GoogleAccessToken:
          Scopes:
            Scope: https://www.googleapis.com/auth/cloud-platform
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/endpoints/openapi/chat/completions
    flows: []
    faultRules: []
    httpTargetConnection:
      Properties: {}
      URL: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/endpoints/openapi/chat/completions
      Authentication:
        GoogleAccessToken:
          Scopes:
            Scope: https://www.googleapis.com/auth/cloud-platform
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
    flows: []
    faultRules: []
    httpTargetConnection:
      Properties: {}
      URL: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
      Authentication:
        GoogleAccessToken:
          Scopes:
            Scope: https://www.googleapis.com/auth/cloud-platform
policies:
  - name: JS-SetTargetUrl
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-SetTargetUrl
        DisplayName: JS-SetTargetUrl
        Properties: {}
        Source: |
          var suffix = context.getVariable("proxy.pathsuffix") || "";
          var qs = context.getVariable("request.querystring");
          if (!qs) {
            var uri = context.getVariable("request.uri") || "";
            var qIdx = uri.indexOf("?");
            if (qIdx !== -1) {
              qs = uri.substring(qIdx + 1);
            }
          }
          var host = "https://aiplatform.googleapis.com";
          var currentTargetUrl = context.getVariable("target.url");
          if (currentTargetUrl) {
            var match = currentTargetUrl.match(/^(https?:\/\/[^\/]+)/);
            if (match) {
              host = match[1];
            }
          }
          var project = "{GoogleCloudProject}";
          if (project.indexOf("{") !== -1) {
            project = context.getVariable("GoogleCloudProject") || context.getVariable("organization.name") || "";
          }
          var provider = context.getVariable("ai.provider") || "google";
          var targetUrl = host + "/v1/projects/" + project + "/locations/global/publishers/" + provider + "/models" + suffix;
          if (qs) {
            targetUrl += "?" + qs;
          }
          context.setVariable("target.copy.pathsuffix", false);
          context.setVariable("target.url", targetUrl);
resources: []
tests: []
