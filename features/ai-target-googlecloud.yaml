# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
type: feature
documentation: "https://gcp-samples.github.io/apigee-template-repository?file=features%2Fai-target-googlecloud.yaml"
description: Proxy for Google Cloud Model Garden models.
parameters:
  - name: GoogleCloudProject
    default: "{organization.name}"
defaultEndpoint:
  name: default
  routes:
    - name: route-googlecloud
      condition: target.route = "googlecloud"
      target: googlecloud
    - name: route-googlecloud-oai
      condition: target.route = "googlecloud-oai"
      target: googlecloud-oai
    - name: route-googlecloud-projects
      condition: target.route = "googlecloud-project"
      target: googlecloud-projects
    - name: default
      target: googlecloud
endpoints: []
targets:
  - name: googlecloud-projects
    url: https://aiplatform.googleapis.com/v1/projects
    flows:
      - name: PreFlow
        mode: Request
        steps:
        - name: AM-SetGoogleToken
          condition: request.header.Authorization == null
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/endpoints/openapi/chat/completions
    flows:
      - name: PreFlow
        mode: Request
        steps:
        - name: AM-SetGoogleToken
          condition: request.header.Authorization == null
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{GoogleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
    flows:
      - name: PreFlow
        mode: Request
        steps:
        - name: AM-SetGoogleToken
          condition: request.header.Authorization == null
policies:
  - name: AM-SetGoogleToken
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetGoogleToken
        DisplayName: AM-SetGoogleToken
        Properties: {}
        Set:
          Authentication:
            HeaderName: Authorization
            GoogleAccessToken:
              Scopes:
                Scope: https://www.googleapis.com/auth/cloud-platform
        IgnoreUnresolvedVariables: "true"
        AssignTo:
          metadata:
            createNew: "false"
            transport: http
            type: request
resources: []
tests: []
