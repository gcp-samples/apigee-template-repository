# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
type: feature
documentation: "https://gcp-samples.github.io/apigee-template-repository?file=features%2Fai-target-googlecloudeu.yaml"
description: Proxy for Google Cloud Model Garden models.
endpoints:
  - name: googlecloudeu
    basePath: /v1/projects
    routes:
      - name: googlecloudeu
        target: googlecloudeu
    flows: []
    faultRules: []
parameters: []
targets:
  - name: googlecloud
    url: https://aiplatform.eu.rep.googleapis.com/v1/projects
    flows: []
    faultRules: []
    httpTargetConnection:
      Properties: {}
      URL: https://aiplatform.eu.rep.googleapis.com/v1/projects
      Authentication:
        GoogleAccessToken:
          Scopes:
            Scope: https://www.googleapis.com/auth/cloud-platform
policies: []
resources: []
tests: []
