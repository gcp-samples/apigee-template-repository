# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
type: feature
documentation: "https://gcp-samples.github.io/apigee-template-repository?file=features%2Fai-target-googlecloudeu.yaml"
description: Proxy for Google Cloud Model Garden models.
endpoints:
  - name: googlecloudeu
    basePath: /v1/projects
    routes:
      - name: googlecloudeu
        target: googlecloudeu
    flows: []
    faultRules: []
parameters: []
targets:
  - name: googlecloud
    url: https://aiplatform.eu.rep.googleapis.com/v1/projects
    flows:
      - name: PreFlow
        mode: Request
        steps:
        - name: AM-SetGoogleToken
          condition: request.header.Authorization == null
    faultRules: []
policies:
  - name: AM-SetGoogleToken
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetGoogleToken
        DisplayName: AM-SetGoogleToken
        Properties: {}
        Set:
          Authentication:
            HeaderName: Authorization
            GoogleAccessToken:
              Scopes:
                Scope: https://www.googleapis.com/auth/cloud-platform
        IgnoreUnresolvedVariables: "true"
        AssignTo:
          metadata:
            createNew: "false"
            transport: http
            type: request
resources: []
tests: []
