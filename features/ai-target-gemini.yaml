# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
type: feature
documentation: "https://gcp-samples.github.io/apigee-template-repository/docs/?file=features/ai-target-gemini.yaml"
description: Proxy for Google Gemini models.
defaultEndpoint:
  name: default
  routes:
    - name: route-gemini
      condition: target.route = "gemini"
      target: gemini
endpoints: []
parameters: []
targets:
  - name: gemini
    url: https://generativelanguage.googleapis.com/v1beta/interactions
    flows: []
policies: []
resources: []
tests: []
