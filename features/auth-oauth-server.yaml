          context.setVariable("reg_code_challenge_method", context.getVariable("request.queryparam.code_challenge_method") || "S256");

  - name: AM-RegisterUserForm
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-RegisterUserForm
        IgnoreUnresolvedVariables: "true"
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: |
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Create Account | OpenID Connect IdP</title>
                <style>
                  :root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #0b0f19; --card: #111827; --border: #1f2937; --text: #f9fafb; --text-muted: #9ca3af; --input-bg: #1f2937; }
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
                  .container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; padding: 36px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); }
                  .badge { display: inline-flex; align-items: center; background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 20px; border: 1px solid rgba(59, 130, 246, 0.3); }
                  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
