                  .btn:hover { background: var(--primary-hover); }
                  .links { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 13px; }
                  .links a { color: var(--primary); text-decoration: none; font-weight: 500; }
                </style>
              </head>
              <body>
