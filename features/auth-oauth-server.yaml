                  <p>{reg_error_message}</p>
                  <a href="/register-user?client_id={reg_client_id}&redirect_uri={reg_redirect_uri}&response_type={reg_response_type}&scope={reg_scope}&state={reg_state}&code_challenge={reg_code_challenge}&code_challenge_method={reg_code_challenge_method}">Try Again</a>
                </div>
              </body>
              </html>

  - name: JS-ProcessMFASetup
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessMFASetup
        DisplayName: JS-ProcessMFASetup
        Properties: {}
        Source: |
          function randBase32(len) {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            var str = "";
            for (var i = 0; i < len; i++) {
              str += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return str;
          }

          var verb = context.getVariable("request.verb");
          var email, secret;

          var clientId = context.getVariable("request.queryparam.client_id") || context.getVariable("request.formparam.client_id") || "";
          var redirectUri = context.getVariable("request.queryparam.redirect_uri") || context.getVariable("request.formparam.redirect_uri") || "";
          var responseType = context.getVariable("request.queryparam.response_type") || context.getVariable("request.formparam.response_type") || "code";
          var scope = context.getVariable("request.queryparam.scope") || context.getVariable("request.formparam.scope") || "";
          var state = context.getVariable("request.queryparam.state") || context.getVariable("request.formparam.state") || "";
          var codeChallenge = context.getVariable("request.queryparam.code_challenge") || context.getVariable("request.formparam.code_challenge") || "";
          var codeChallengeMethod = context.getVariable("request.queryparam.code_challenge_method") || context.getVariable("request.formparam.code_challenge_method") || "";

          context.setVariable("reg_client_id", clientId);
          context.setVariable("reg_redirect_uri", redirectUri);
          context.setVariable("reg_response_type", responseType);
          context.setVariable("reg_scope", scope);
          context.setVariable("reg_state", state);
          context.setVariable("reg_code_challenge", codeChallenge);
          context.setVariable("reg_code_challenge_method", codeChallengeMethod);

          if (verb === "POST") {
            email = (context.getVariable("request.formparam.email") || "").trim();
            secret = (context.getVariable("request.formparam.mfa_secret") || "").trim();
            context.setVariable("mfa_verify_action", "confirm");
          } else {
            email = (context.getVariable("request.queryparam.email") || context.getVariable("request.queryparam.username") || "").trim();
            secret = (context.getVariable("request.queryparam.secret") || "").trim();
            context.setVariable("mfa_verify_action", "view");
          }

          if (!secret) {
            secret = randBase32(16);
          }

          var issuer = context.getVariable("mfa_issuer_name") || "ApigeeIdP";
          var accountLabel = email || "User";
          var otpauth = "otpauth://totp/" + encodeURIComponent(issuer + ":" + accountLabel) + "?secret=" + secret + "&issuer=" + encodeURIComponent(issuer) + "&algorithm=SHA1&digits=6&period=30";
          var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(otpauth);

          context.setVariable("mfa_user_email", email);
          context.setVariable("mfa_secret_display", secret);
          context.setVariable("mfa_secret_to_save", secret);
          context.setVariable("mfa_otpauth_uri", otpauth);
          context.setVariable("mfa_qr_url", qrUrl);
          context.setVariable("auth_user_email", email);
          context.setVariable("mfa_error_display", "none");
          context.setVariable("mfa_error_message", "");

  - name: JS-VerifyMFACodeAndActivate
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "300"
          name: JS-VerifyMFACodeAndActivate
        DisplayName: JS-VerifyMFACodeAndActivate
        Properties: {}
        Source: |
          (function() {
          function base32Decode(str) {
            var b32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            var cleanStr = str.toUpperCase().replace(/=+$/, "");
            var bits = 0, val = 0; var out = [];
            for (var i = 0; i < cleanStr.length; i++) {
              var idx = b32.indexOf(cleanStr.charAt(i)); if (idx === -1) continue;
              val = (val << 5) | idx; bits += 5;
              if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; }
            }
            return out;
          }

          function sha1Block(words) {
            var h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
            var w = new Array(80);
            for (var i = 0; i < words.length; i += 16) {
              for (var t = 0; t < 16; t++) w[t] = words[i + t] | 0;
              for (var t = 16; t < 80; t++) { var s = w[t - 3] ^ w[t - 8] ^ w[t - 14] ^ w[t - 16]; w[t] = (s << 1) | (s >>> 31); }
              var a = h0, b = h1, c = h2, d = h3, e = h4;
              for (var t = 0; t < 80; t++) {
                var f, k;
                if (t < 20) { f = (b & c) | ((~b) & d); k = 0x5A827999; }
                else if (t < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
                else if (t < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
                else { f = b ^ c ^ d; k = 0xCA62C1D6; }
                var temp = (((a << 5) | (a >>> 27)) + f + e + k + w[t]) | 0;
                e = d; d = c; c = (b << 30) | (b >>> 2); b = a; a = temp;
              }
              h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
            }
            return [h0, h1, h2, h3, h4];
          }

          function hmacSha1(keyBytes, msgBytes) {
            var k = keyBytes.slice();
            if (k.length > 64) {
              var kw = bytesToWords(k, k.length * 8); var kh = sha1Block(kw); k = [];
              for (var i = 0; i < 5; i++) for (var b = 3; b >= 0; b--) k.push((kh[i] >>> (b * 8)) & 255);
            }
            while (k.length < 64) k.push(0);
            var o_key_pad = [], i_key_pad = [];
            for (var i = 0; i < 64; i++) { o_key_pad.push(k[i] ^ 0x5c); i_key_pad.push(k[i] ^ 0x36); }
            var innerMsg = i_key_pad.concat(msgBytes);
            var innerWords = bytesToWords(innerMsg, innerMsg.length * 8);
            var innerHash = sha1Block(innerWords);
            var innerHashBytes = [];
            for (var i = 0; i < 5; i++) for (var b = 3; b >= 0; b--) innerHashBytes.push((innerHash[i] >>> (b * 8)) & 255);
            var outerMsg = o_key_pad.concat(innerHashBytes);
            var outerWords = bytesToWords(outerMsg, outerMsg.length * 8);
            var outerHash = sha1Block(outerWords);
            var out = [];
            for (var i = 0; i < 5; i++) for (var b = 3; b >= 0; b--) out.push((outerHash[i] >>> (b * 8)) & 255);
            return out;
          }

          function bytesToWords(bytes, bitLength) {
            var words = [];
            for (var i = 0; i < bytes.length; i++) words[i >> 2] |= (bytes[i] & 255) << ((3 - i % 4) * 8);
            words[bitLength >> 5] |= 0x80 << (24 - (bitLength % 32));
            var totalWords = (((bitLength + 64) >>> 9) << 4) + 16;
            while (words.length < totalWords) words.push(0);
            words[totalWords - 1] = bitLength & 0xFFFFFFFF;
            words[totalWords - 2] = Math.floor(bitLength / 0x100000000);
            return words;
          }

          function verifyTotp(base32Secret, userCode) {
            if (!base32Secret || !userCode) return false;
            var keyBytes = base32Decode(base32Secret);
            var nowSec = Math.floor(Date.now() / 1000);
            var step = Math.floor(nowSec / 30);
            for (var drift = -1; drift <= 1; drift++) {
              var t = step + drift;
              var msg = [0, 0, 0, 0, (t >>> 24) & 255, (t >>> 16) & 255, (t >>> 8) & 255, t & 255];
              var h = hmacSha1(keyBytes, msg);
              var offset = h[19] & 0x0f;
              var code = ((h[offset] & 0x7f) << 24 | (h[offset + 1] & 255) << 16 | (h[offset + 2] & 255) << 8 | (h[offset + 3] & 255)) % 1000000;
              var codeStr = ("000000" + code).slice(-6);
              if (codeStr === String(userCode).trim()) return true;
            }
            return false;
          }

          var secret = context.getVariable("mfa_secret_to_save");
          var userCode = (context.getVariable("request.formparam.mfa_code") || "").replace(/[^0-9]/g, "");
          var email = (context.getVariable("request.formparam.email") || context.getVariable("mfa_user_email") || "").trim();

          context.setVariable("mfa_user_email", email);
          context.setVariable("auth_user_email", email);

          var devResCode = context.getVariable("getDevUserRes.status.code");
          if (devResCode && String(devResCode) !== "200") {
            context.setVariable("mfa_confirmed", "false");
            context.setVariable("mfa_error_message", "Account not found for email: " + (email || "unknown"));
            context.setVariable("mfa_error_display", "block");
          } else if (verifyTotp(secret, userCode)) {
            context.setVariable("mfa_confirmed", "true");
          } else {
            context.setVariable("mfa_confirmed", "false");
            context.setVariable("mfa_error_message", "Invalid 6-digit code. Please verify time synchronization and try again.");
            context.setVariable("mfa_error_display", "block");
          }
          })();

