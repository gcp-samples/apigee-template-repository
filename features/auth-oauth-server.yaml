  - name: JWT-GenerateAccessToken
    type: GenerateJWT
    content:
      GenerateJWT:
        metadata:
          name: JWT-GenerateAccessToken
        Algorithm: HS256
        IgnoreUnresolvedVariables: "false"
        SecretKey:
          Value:
            metadata:
              ref: private.jwt_signing_secret
        Issuer:
          metadata:
            ref: token_issuer
        Audience:
          metadata:
            ref: token_client_id
        ExpiresIn: 1h
        Subject:
          metadata:
            ref: token_subject
        AdditionalClaims:
          Claim:
            - metadata:
                name: scope
                ref: token_scope
            - metadata:
                name: client_id
                ref: token_client_id
            - metadata:
                name: email
                ref: token_email
            - metadata:
                name: name
                ref: token_name
            - metadata:
                name: given_name
                ref: token_user_first_name
            - metadata:
                name: family_name
                ref: token_user_last_name
            - metadata:
                name: preferred_username
                ref: token_user_username
            - metadata:
                name: token_type
                ref: token_type_claim
        OutputVariable: token_access_token

  - name: JWT-GenerateIDToken
    type: GenerateJWT
    content:
      GenerateJWT:
        metadata:
          name: JWT-GenerateIDToken
        Algorithm: HS256
        IgnoreUnresolvedVariables: "true"
        SecretKey:
          Value:
            metadata:
              ref: private.jwt_signing_secret
        Issuer:
          metadata:
            ref: token_issuer
        Audience:
          metadata:
            ref: token_client_id
        ExpiresIn: 1h
        Subject:
          metadata:
            ref: token_subject
        AdditionalClaims:
          Claim:
            - metadata:
                name: email
                ref: token_email
            - metadata:
                name: email_verified
                ref: token_email_verified
            - metadata:
                name: name
                ref: token_name
            - metadata:
                name: given_name
                ref: token_user_first_name
            - metadata:
                name: family_name
                ref: token_user_last_name
            - metadata:
                name: preferred_username
                ref: token_user_username
            - metadata:
                name: auth_time
                ref: token_auth_time
            - metadata:
                name: nonce
                ref: token_nonce
        OutputVariable: token_id_token

  - name: JS-FinalizeTokenResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-FinalizeTokenResponse
        DisplayName: JS-FinalizeTokenResponse
        Properties: {}
        Source: |
          function randHex(len) {
            var chars = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            var str = "";
            for (var i = 0; i < len; i++) {
              str += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return str;
          }

          var grantType = context.getVariable("token_grant_type");
          var formatToIssue = context.getVariable("token_format_to_issue") || "jwt";
          var accessToken = "";

          if (formatToIssue === "opaque") {
            accessToken = "at_" + randHex(32);
            context.setVariable("token_access_token", accessToken);

            var opaqueTokenRecord = {
              "access_token": accessToken,
              "client_id": context.getVariable("token_client_id"),
              "sub": context.getVariable("token_subject"),
              "email": context.getVariable("token_email"),
              "name": context.getVariable("token_name"),
              "given_name": context.getVariable("token_user_first_name"),
              "family_name": context.getVariable("token_user_last_name"),
              "preferred_username": context.getVariable("token_user_username"),
              "scope": context.getVariable("token_scope"),
              "iss": context.getVariable("token_issuer"),
              "exp": Math.floor(Date.now() / 1000) + 3600,
              "iat": Math.floor(Date.now() / 1000)
            };
            context.setVariable("opaque_access_token_data", JSON.stringify(opaqueTokenRecord));
          } else {
            accessToken = context.getVariable("token_access_token");
          }

          var newRefreshToken = "rt_" + randHex(32);
          context.setVariable("token_refresh_token", newRefreshToken);

          var refreshRecord = {
            "client_id": context.getVariable("token_client_id"),
            "username": context.getVariable("token_subject"),
            "email": context.getVariable("token_email"),
            "name": context.getVariable("token_name"),
            "given_name": context.getVariable("token_user_first_name"),
            "family_name": context.getVariable("token_user_last_name"),
            "preferred_username": context.getVariable("token_user_username"),
            "scope": context.getVariable("token_scope")
          };
          context.setVariable("new_refresh_token_data", JSON.stringify(refreshRecord));

          var responseObj = {
            "access_token": accessToken,
            "token_type": "Bearer",
            "expires_in": 3600,
            "scope": context.getVariable("token_scope")
          };

          if (grantType !== "client_credentials") {
            responseObj.refresh_token = newRefreshToken;
          }

          if (context.getVariable("token_scope_has_openid") === "true") {
            var idToken = context.getVariable("token_id_token");
            if (idToken) {
              responseObj.id_token = idToken;
            }
          }

          context.setVariable("final_token_response", JSON.stringify(responseObj, null, 2));

  - name: PC-StoreOpaqueAccessToken
    type: PopulateCache
    content:
      PopulateCache:
        metadata:
          name: PC-StoreOpaqueAccessToken
        CacheKey:
          Prefix: OAuth21-AccessToken
          KeyFragment:
            metadata:
              ref: token_access_token
        ExpirySettings:
          TimeoutInSec: "3600"
        Source: opaque_access_token_data

  - name: PC-StoreRefreshToken
    type: PopulateCache
    content:
      PopulateCache:
        metadata:
          name: PC-StoreRefreshToken
        CacheKey:
          Prefix: OAuth21-Refresh
          KeyFragment:
            metadata:
              ref: token_refresh_token
        ExpirySettings:
          TimeoutInSec: "2592000"
        Source: new_refresh_token_data

  - name: AM-TokenResponse
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-TokenResponse
        Set:
          Payload:
            metadata:
              contentType: application/json
            _text: "{final_token_response}"

  - name: AM-TokenErrorResponse
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-TokenErrorResponse
        Set:
          StatusCode: "400"
          ReasonPhrase: Bad Request
          Payload:
            metadata:
              contentType: application/json
            _text: |
              {
                "error": "{token_error}",
                "error_description": "{token_error_description}"
              }

  - name: JS-ExtractIntrospectParams
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ExtractIntrospectParams
        DisplayName: JS-ExtractIntrospectParams
        Properties: {}
        Source: |
          var token = (context.getVariable("request.formparam.token") || "").trim();
          if (!token) {
            token = (context.getVariable("request.queryparam.token") || "").trim();
          }
          context.setVariable("introspect_token", token);

          if (token.split(".").length === 3) {
            context.setVariable("introspect_token_format", "jwt");
          } else if (token) {
            context.setVariable("introspect_token_format", "opaque");
          } else {
            context.setVariable("introspect_token_format", "none");
          }

  - name: LC-LookupOpaqueIntrospectToken
    type: LookupCache
    content:
      LookupCache:
        metadata:
          name: LC-LookupOpaqueIntrospectToken
        AssignTo: opaque_introspect_data
        CacheKey:
          Prefix: OAuth21-AccessToken
          KeyFragment:
            metadata:
              ref: introspect_token

  - name: JWT-VerifyIntrospectToken
    type: VerifyJWT
    content:
      VerifyJWT:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: JWT-VerifyIntrospectToken
        Algorithm: HS256
        IgnoreUnresolvedVariables: "true"
        SecretKey:
          Value:
            metadata:
              ref: private.jwt_signing_secret
        Source: introspect_token

  - name: JS-FormatIntrospectResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-FormatIntrospectResponse
        DisplayName: JS-FormatIntrospectResponse
        Properties: {}
        Source: |
          var tokenFormat = context.getVariable("introspect_token_format");
          var result = { active: false };

          if (tokenFormat === "jwt") {
            var isValid = context.getVariable("jwt.JWT-VerifyIntrospectToken.valid") === "true" || context.getVariable("jwt.JWT-VerifyIntrospectToken.valid") === true;
            if (isValid) {
              result.active = true;
              result.sub = context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.subject") || "";
              result.scope = context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.scope") || "";
              result.client_id = context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.client_id") || "";
              result.iss = context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.issuer") || "";
              result.exp = parseInt(context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.expiry") || "0", 10);
              result.iat = parseInt(context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.issued_at") || "0", 10);
              result.token_type = "Bearer";
            }
          } else if (tokenFormat === "opaque") {
            var opaqueDataStr = context.getVariable("opaque_introspect_data");
            if (opaqueDataStr) {
              try {
                var oData = JSON.parse(opaqueDataStr);
                result.active = true;
                result.sub = oData.sub || "";
                result.scope = oData.scope || "";
                result.client_id = oData.client_id || "";
                result.iss = oData.iss || "";
                result.exp = oData.exp || 0;
                result.iat = oData.iat || 0;
                result.token_type = "Bearer";
              } catch (e) {}
            }
          }

          context.setVariable("response.content", JSON.stringify(result, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-ExtractBearerToken
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ExtractBearerToken
        DisplayName: JS-ExtractBearerToken
        Properties: {}
        Source: |
          var authHeader = context.getVariable("request.header.Authorization") || "";
          var bearerToken = "";
          if (authHeader.indexOf("Bearer ") === 0) {
            bearerToken = authHeader.substring(7).trim();
          }
          context.setVariable("bearer_token", bearerToken);

          if (bearerToken.split(".").length === 3) {
            context.setVariable("userinfo_token_format", "jwt");
          } else if (bearerToken) {
            context.setVariable("userinfo_token_format", "opaque");
          } else {
            context.setVariable("userinfo_token_format", "none");
          }

  - name: LC-LookupOpaqueUserInfoToken
    type: LookupCache
    content:
      LookupCache:
        metadata:
          name: LC-LookupOpaqueUserInfoToken
        AssignTo: opaque_userinfo_data
        CacheKey:
          Prefix: OAuth21-AccessToken
          KeyFragment:
            metadata:
              ref: bearer_token

  - name: JWT-VerifyUserInfoToken
    type: VerifyJWT
    content:
      VerifyJWT:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: JWT-VerifyUserInfoToken
        Algorithm: HS256
        IgnoreUnresolvedVariables: "true"
        SecretKey:
          Value:
            metadata:
              ref: private.jwt_signing_secret
        Source: bearer_token

  - name: JS-FormatUserInfoResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-FormatUserInfoResponse
        DisplayName: JS-FormatUserInfoResponse
        Properties: {}
        Source: |
          var tokenFormat = context.getVariable("userinfo_token_format");
          var valid = false;
          var sub = "", name = "", email = "", given_name = "", family_name = "", preferred_username = "", scope = "";

          if (tokenFormat === "jwt") {
            var jwtValid = context.getVariable("jwt.JWT-VerifyUserInfoToken.valid") === "true" || context.getVariable("jwt.JWT-VerifyUserInfoToken.valid") === true;
            if (jwtValid) {
              valid = true;
              sub = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.subject") || "";
              name = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.name") || "";
              email = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.email") || "";
              given_name = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.given_name") || "";
              family_name = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.family_name") || "";
              preferred_username = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.preferred_username") || "";
              scope = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.scope") || "";
            }
          } else if (tokenFormat === "opaque") {
            var opaqueDataStr = context.getVariable("opaque_userinfo_data");
            if (opaqueDataStr) {
              try {
                var oData = JSON.parse(opaqueDataStr);
                valid = true;
                sub = oData.sub || "";
                name = oData.name || "";
                email = oData.email || "";
                given_name = oData.given_name || "";
                family_name = oData.family_name || "";
                preferred_username = oData.preferred_username || "";
                scope = oData.scope || "";
              } catch (e) {}
            }
          }

          context.setVariable("userinfo_valid", valid ? "true" : "false");
          if (valid) {
            var uObj = {
              sub: sub,
              name: name,
              given_name: given_name,
              family_name: family_name,
              preferred_username: preferred_username,
              email: email,
              email_verified: true,
              scope: scope
            };
            context.setVariable("userinfo_response_payload", JSON.stringify(uObj, null, 2));
          }

  - name: AM-UserInfoResponse
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-UserInfoResponse
        Set:
          Payload:
            metadata:
              contentType: application/json
            _text: "{userinfo_response_payload}"

  - name: AM-UserInfoErrorResponse
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-UserInfoErrorResponse
        Set:
          StatusCode: "401"
          ReasonPhrase: Unauthorized
          Headers:
            Header:
              - metadata:
                  name: WWW-Authenticate
                _text: 'Bearer error="invalid_token", error_description="Access token is missing, expired, or invalid."'
          Payload:
            metadata:
              contentType: application/json
            _text: |
              {
                "error": "invalid_token",
                "error_description": "Access token is missing, expired, or invalid."
              }

  - name: JS-ProcessRevocation
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessRevocation
        DisplayName: JS-ProcessRevocation
        Properties: {}
        Source: |
          var token = (context.getVariable("request.formparam.token") || "").trim();
          var hint = (context.getVariable("request.formparam.token_type_hint") || "").trim();

          if (hint === "refresh_token" || token.indexOf("rt_") === 0) {
            context.setVariable("revoke_token_type", "refresh_token");
            context.setVariable("refresh_token", token);
          } else if (hint === "code" || token.indexOf("ac_") === 0) {
            context.setVariable("revoke_token_type", "code");
            context.setVariable("auth_code", token);
          } else if (hint === "access_token" || token.indexOf("at_") === 0) {
            context.setVariable("revoke_token_type", "access_token");
            context.setVariable("revoke_access_token", token);
          } else {
            context.setVariable("revoke_token_type", "other");
            context.setVariable("revoke_access_token", token);
            context.setVariable("refresh_token", token);
          }

  - name: IC-InvalidateRevokedOpaqueAccessToken
    type: InvalidateCache
    content:
      InvalidateCache:
        metadata:
          name: IC-InvalidateRevokedOpaqueAccessToken
        CacheKey:
          Prefix: OAuth21-AccessToken
          KeyFragment:
            metadata:
              ref: revoke_access_token

  - name: IC-InvalidateRevokedRefreshToken
    type: InvalidateCache
    content:
      InvalidateCache:
        metadata:
          name: IC-InvalidateRevokedRefreshToken
        CacheKey:
          Prefix: OAuth21-Refresh
          KeyFragment:
            metadata:
              ref: refresh_token

  - name: IC-InvalidateRevokedCode
    type: InvalidateCache
    content:
      InvalidateCache:
        metadata:
          name: IC-InvalidateRevokedCode
        CacheKey:
          Prefix: OAuth21-AuthCode
          KeyFragment:
            metadata:
              ref: auth_code

  - name: AM-RevokeSuccess
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-RevokeSuccess
        Set:
          StatusCode: "200"
          ReasonPhrase: OK
          Payload:
            metadata:
              contentType: application/json
            _text: |
              {
                "status": "revoked"
              }
resources: []
tests: []
