  - name: JS-PrepareRegisterResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-PrepareRegisterResponse
        DisplayName: JS-PrepareRegisterResponse
        Properties: {}
        Source: |
          function randBase32(len) {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            var str = "";
            for (var i = 0; i < len; i++) {
              str += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return str;
          }

          var email = context.getVariable("reg_user_email");
          var secret = context.getVariable("reg_mfa_secret");
          if (!secret) {
            secret = randBase32(16);
            context.setVariable("reg_mfa_secret", secret);
          }
          var issuer = context.getVariable("mfa_issuer_name") || "ApigeeIdP";
          var otpauth = "otpauth://totp/" + encodeURIComponent(issuer + ":" + email) + "?secret=" + secret + "&issuer=" + encodeURIComponent(issuer) + "&algorithm=SHA1&digits=6&period=30";
          var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(otpauth);

          context.setVariable("mfa_otpauth_uri", otpauth);
          context.setVariable("mfa_qr_url", qrUrl);
          context.setVariable("mfa_user_email", email);
          context.setVariable("mfa_secret_display", secret);
          context.setVariable("mfa_secret_to_save", secret);
          context.setVariable("mfa_error_display", "none");
          context.setVariable("mfa_error_message", "");

  - name: AM-MFASetupPage
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-MFASetupPage
        IgnoreUnresolvedVariables: "true"
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: |
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Setup Authenticator App | OpenID Connect IdP</title>
                <style>
                  :root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #0b0f19; --card: #111827; --border: #1f2937; --text: #f9fafb; --text-muted: #9ca3af; --input-bg: #1f2937; }
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
                  .container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; padding: 36px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); text-align: center; }
                  .badge { display: inline-flex; align-items: center; background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 20px; border: 1px solid rgba(59, 130, 246, 0.3); }
                  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
                  p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
                  .qr-box { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; margin-bottom: 18px; }
                  .qr-box img { display: block; border-radius: 4px; width: 180px; height: 180px; }
                  .secret-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
                  .secret-key { font-family: ui-monospace, monospace; font-size: 16px; letter-spacing: 0.15em; background: var(--input-bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; display: inline-block; margin-bottom: 24px; color: #60a5fa; }
                  .form-group { margin-bottom: 20px; text-align: left; }
                  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
                  input[type="text"], input[type="email"] { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none; }
                  input#mfa_code { font-size: 18px; letter-spacing: 0.2em; text-align: center; font-weight: 600; }
                  input:focus { border-color: var(--primary); }
                  .btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
                  .btn:hover { background: var(--primary-hover); }
                  .error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
                </style>
              </head>
              <body>
                <div class="container">
                  <span class="badge">Two-Factor Authentication</span>
                  <h1>Setup Authenticator</h1>
                  <p>Scan this QR code with Google Authenticator, Aegis, Authy, or any RFC 6238 TOTP app.</p>

                  <div class="error" style="display: {mfa_error_display};">{mfa_error_message}</div>

                  <div class="qr-box">
                    <img src="{mfa_qr_url}" alt="MFA QR Code">
                  </div>

                  <div class="secret-label">Manual Entry Key:</div>
                  <div class="secret-key">{mfa_secret_display}</div>

                  <form action="/mfa-setup" method="POST">
                    <input type="hidden" name="mfa_secret" value="{mfa_secret_display}">
                    <input type="hidden" name="client_id" value="{reg_client_id}">
                    <input type="hidden" name="redirect_uri" value="{reg_redirect_uri}">
                    <input type="hidden" name="response_type" value="{reg_response_type}">
                    <input type="hidden" name="scope" value="{reg_scope}">
                    <input type="hidden" name="state" value="{reg_state}">
                    <input type="hidden" name="code_challenge" value="{reg_code_challenge}">
                    <input type="hidden" name="code_challenge_method" value="{reg_code_challenge_method}">

                    <div class="form-group">
                      <label for="email">Account Email</label>
                      <input type="email" id="email" name="email" value="{mfa_user_email}" placeholder="user@example.com" required>
                    </div>

                    <div class="form-group">
                      <label for="mfa_code">Verification Code</label>
                      <input type="text" id="mfa_code" name="mfa_code" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456" required autofocus>
                    </div>

                    <button type="submit" class="btn">Verify & Activate MFA</button>
                  </form>
                </div>
                <script>
                  (function() {
                    var emailInput = document.getElementById('email');
                    var qrImg = document.querySelector('.qr-box img');
                    var secret = document.querySelector('input[name="mfa_secret"]').value;
                    var issuer = "ApigeeIdP";
                    if (emailInput && qrImg && secret) {
                      emailInput.addEventListener('input', function() {
                        var em = (emailInput.value || '').trim() || 'User';
                        var uri = 'otpauth://totp/' + encodeURIComponent(issuer + ':' + em) + '?secret=' + secret + '&issuer=' + encodeURIComponent(issuer) + '&algorithm=SHA1&digits=6&period=30';
                        qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(uri);
                      });
                    }
                    var mfaInput = document.getElementById('mfa_code');
                    if (mfaInput) {
                      var form = mfaInput.closest('form');
                      if (form) {
                        form.addEventListener('submit', function() {
                          mfaInput.value = mfaInput.value.replace(/[^0-9]/g, '');
                        });
                      }
                    }
                  })();
                </script>
              </body>
              </html>

