  - name: JS-ValidateAuthorize
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ValidateAuthorize
        DisplayName: JS-ValidateAuthorize
        Properties: {}
        Source: |
          var clientId = context.getVariable("auth_client_id");
          var redirectUri = context.getVariable("auth_redirect_uri");
          var responseType = context.getVariable("auth_response_type");
          var codeChallenge = context.getVariable("auth_code_challenge");
          var codeChallengeMethod = context.getVariable("auth_code_challenge_method");
          var isCimd = context.getVariable("is_cimd") === "true";

          var error = null;
          var errorDesc = null;
          var clientDisplayName = clientId;

          if (!clientId) {
            error = "invalid_client";
            errorDesc = "client_id parameter is required.";
          } else if (!redirectUri) {
            error = "invalid_request";
            errorDesc = "redirect_uri parameter is required.";
          } else if (responseType !== "code") {
            error = "unsupported_response_type";
            errorDesc = "Only response_type=code is supported under OAuth 2.1.";
          } else if (!codeChallenge) {
            error = "invalid_request";
            errorDesc = "Proof Key for Code Exchange (PKCE) code_challenge is MANDATORY under OAuth 2.1.";
          } else if (codeChallengeMethod !== "S256" && codeChallengeMethod !== "plain") {
            error = "invalid_request";
            errorDesc = "PKCE code_challenge_method must be 'S256' or 'plain'.";
          }

          if (!error) {
            if (isCimd) {
              var cimdContent = context.getVariable("cimd_doc_cached") || context.getVariable("fetchCimdResponse.content");
              if (cimdContent) {
                try {
                  var cimdDoc = JSON.parse(cimdContent);
                  clientDisplayName = cimdDoc.client_name || cimdDoc.client_id || clientId;
                  var allowedUris = cimdDoc.redirect_uris || [];
                  var uriMatch = false;
                  for (var i = 0; i < allowedUris.length; i++) {
                    if (String(allowedUris[i]).trim() === redirectUri) {
                      uriMatch = true;
                      break;
                    }
                  }
                  if (!uriMatch && allowedUris.length > 0) {
                    error = "invalid_redirect_uri";
                    errorDesc = "redirect_uri does not match any registered in CIMD document.";
                  }
                } catch (e) {
                  error = "invalid_client";
                  errorDesc = "Failed to parse Client ID Metadata Document from URL.";
                }
              }
            } else {
              var clientCached = context.getVariable("client_record_cached");
              var kvmClient = context.getVariable("kvm_client_record");
              var appRes = context.getVariable("getAppResponse.content");
              var clientRaw = clientCached || kvmClient;

              if (clientRaw) {
                try {
                  var clientData = JSON.parse(clientRaw);
                  clientDisplayName = clientData.client_name || clientId;
                  var uris = clientData.redirect_uris || [];
                  var matched = false;
                  for (var j = 0; j < uris.length; j++) {
                    if (String(uris[j]).trim() === redirectUri) {
                      matched = true;
                      break;
                    }
                  }
                  if (!matched && uris.length > 0) {
                    error = "invalid_redirect_uri";
                    errorDesc = "redirect_uri mismatch with client registration.";
                  }
                } catch (e2) {}
              } else if (appRes) {
                try {
                  var appData = JSON.parse(appRes);
                  clientDisplayName = appData.name || clientId;
                  if (appData.callbackUrl && appData.callbackUrl !== redirectUri) {
                    if (redirectUri.indexOf(appData.callbackUrl) !== 0) {
                      error = "invalid_redirect_uri";
                      errorDesc = "redirect_uri does not match Apigee developer app callbackUrl.";
                    }
                  }
                } catch (e3) {}
              }
            }
          }

          context.setVariable("auth_client_display_name", clientDisplayName);

          if (error) {
            context.setVariable("authorize_valid", "false");
            context.setVariable("authorize_error", error);
            context.setVariable("authorize_error_description", errorDesc);
          } else {
            context.setVariable("authorize_valid", "true");
            context.setVariable("authorize_error", "");
            context.setVariable("authorize_error_description", "");
          }

  - name: AM-AuthorizeForm
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-AuthorizeForm
        IgnoreUnresolvedVariables: "true"
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: |
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Sign In & Authorize | OpenID Connect IdP</title>
                <style>
                  :root {
                    --primary: #3b82f6;
                    --primary-hover: #2563eb;
                    --bg: #0b0f19;
                    --card: #111827;
                    --border: #1f2937;
                    --text: #f9fafb;
                    --text-muted: #9ca3af;
                    --input-bg: #1f2937;
                    --danger: #ef4444;
                  }
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
                  .container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 460px; padding: 36px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); }
                  .badge { display: inline-flex; align-items: center; background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 20px; border: 1px solid rgba(59, 130, 246, 0.3); }
                  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.025em; }
                  p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
                  .client-info { background: rgba(31, 41, 55, 0.6); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 24px; font-size: 13px; }
                  .scopes-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.05em; }
                  .scope-tag { display: inline-block; background: #374151; color: #e5e7eb; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 4px; margin-bottom: 4px; font-family: ui-monospace, SFMono-Regular, monospace; }
                  .form-group { margin-bottom: 18px; }
                  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
                  input[type="text"], input[type="email"], input[type="password"] { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
                  input:focus { border-color: var(--primary); }
                  .btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 6px; }
                  .btn:hover { background: var(--primary-hover); }
                  .links { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; font-size: 13px; text-align: center; }
                  .links a { color: var(--primary); text-decoration: none; font-weight: 500; }
                  .links a:hover { text-decoration: underline; }
                  .links-sub { display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; }
                  .links-sub a { color: var(--text-muted); }
                  .links-sub a:hover { color: var(--text); }
                </style>
              </head>
              <body>
                <div class="container">
                  <span class="badge">OpenID Connect IdP</span>
                  <h1>Sign In</h1>
                  <p>Authorize <strong>{auth_client_display_name}</strong> to access your account.</p>

                  <div class="client-info">
                    <div class="scopes-title">Requested Scopes</div>
                    <div><span class="scope-tag">{auth_scope}</span></div>
                  </div>

                  <form action="/authorize" method="POST">
                    <input type="hidden" name="client_id" value="{auth_client_id}">
                    <input type="hidden" name="redirect_uri" value="{auth_redirect_uri}">
                    <input type="hidden" name="response_type" value="{auth_response_type}">
                    <input type="hidden" name="scope" value="{auth_scope}">
                    <input type="hidden" name="state" value="{auth_state}">
                    <input type="hidden" name="code_challenge" value="{auth_code_challenge}">
                    <input type="hidden" name="code_challenge_method" value="{auth_code_challenge_method}">

                    <div class="form-group">
                      <label for="username">Email Address</label>
                      <input type="email" id="username" name="username" placeholder="user@example.com" required autofocus>
                    </div>

                    <div class="form-group">
                      <label for="password">Password</label>
                      <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn">Sign In & Continue</button>
                  </form>

                  <div class="links">
                    <div>Don't have an account? <a href="/register-user?client_id={auth_client_id}&redirect_uri={auth_redirect_uri}&response_type={auth_response_type}&scope={auth_scope}&state={auth_state}&code_challenge={auth_code_challenge}&code_challenge_method={auth_code_challenge_method}">Create Account</a></div>
                    <div class="links-sub">
                      <a href="/reset-password?client_id={auth_client_id}&redirect_uri={auth_redirect_uri}">Forgot Password?</a>
                      <a href="/delete-account?client_id={auth_client_id}&redirect_uri={auth_redirect_uri}">Delete Account</a>
                    </div>
                  </div>
                </div>
              </body>
              </html>
