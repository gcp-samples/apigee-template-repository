                    Already have an account? <a href="/authorize?client_id={reg_client_id}&redirect_uri={reg_redirect_uri}&response_type={reg_response_type}&scope={reg_scope}&state={reg_state}&code_challenge={reg_code_challenge}&code_challenge_method={reg_code_challenge_method}">Sign In</a>
                  </div>
                </div>
              </body>
              </html>

  - name: JS-ProcessRegisterUserRequest
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "300"
          name: JS-ProcessRegisterUserRequest
        DisplayName: JS-ProcessRegisterUserRequest
        Properties: {}
        Source: |
          (function() {
          // --- SHA-256 implementation ---
          function sha256(ascii) {
            function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
            var mathPow = Math.pow; var maxWord = mathPow(2, 32); var lengthProperty = 'length';
            var i, j; var result = ''; var words = []; var asciiBitLength = ascii[lengthProperty] * 8;
            var hash = []; var k = []; var primeCounter = 0; var isComposite = {};
            for (var candidate = 2; primeCounter < 64; candidate++) {
              if (!isComposite[candidate]) {
                for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
              }
            }
            ascii += '\x80'; while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
            for (i = 0; i < ascii[lengthProperty]; i++) {
              j = ascii.charCodeAt(i); if (j >> 8) return; words[i >> 2] |= j << ((3 - i % 4) * 8);
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength | 0);
            for (j = 0; j < words[lengthProperty];) {
              var w = words.slice(j, j += 16); var oldHash = hash; hash = hash.slice(0, 8);
              for (i = 0; i < 64; i++) {
                var s0 = rightRotate(w[i - 15], 7) ^ rightRotate(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                var s1 = rightRotate(w[i - 2], 17) ^ rightRotate(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
                var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
                var s1h = rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25);
                var s0h = rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22);
                var t1 = (i < 16 ? w[i] : (w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0)) + hash[7] + s1h + ch + k[i];
                var t2 = s0h + maj;
                hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
              }
              for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
            }
            for (i = 0; i < 8; i++) {
              for (var b = 3; b >= 0; b--) {
                var byteVal = (hash[i] >> (b * 8)) & 255;
                result += ((byteVal < 16 ? '0' : '') + byteVal.toString(16));
              }
            }
            return result;
          }

          function randHex(len) {
            var chars = "abcdef0123456789";
            var str = "";
            for (var i = 0; i < len; i++) str += chars.charAt(Math.floor(Math.random() * chars.length));
            return str;
          }

          function randBase32(len) {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            var str = "";
            for (var i = 0; i < len; i++) str += chars.charAt(Math.floor(Math.random() * chars.length));
            return str;
          }

          function b64Enc(str) {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
            var out = "";
            var u = [];
            for (var i = 0; i < str.length; i++) {
              var c = str.charCodeAt(i);
              if (c < 128) u.push(c);
              else if (c < 2048) { u.push((c >> 6) | 192); u.push((c & 63) | 128); }
              else { u.push((c >> 12) | 224); u.push(((c >> 6) & 63) | 128); u.push((c & 63) | 128); }
            }
            var idx = 0;
            while (idx < u.length) {
              var c1 = u[idx++];
              var c2 = idx < u.length ? u[idx++] : NaN;
              var c3 = idx < u.length ? u[idx++] : NaN;
              var e1 = c1 >> 2;
              var e2 = ((c1 & 3) << 4) | (isNaN(c2) ? 0 : c2 >> 4);
              var e3 = isNaN(c2) ? 64 : (((c2 & 15) << 2) | (isNaN(c3) ? 0 : c3 >> 6));
              var e4 = isNaN(c3) ? 64 : c3 & 63;
              out += chars.charAt(e1) + chars.charAt(e2) + chars.charAt(e3) + chars.charAt(e4);
            }
            return out;
          }

          var email = (context.getVariable("request.formparam.email") || "").trim().toLowerCase();
          var password = context.getVariable("request.formparam.password") || "";
          var firstName = (context.getVariable("request.formparam.first_name") || "").trim();
          var lastName = (context.getVariable("request.formparam.last_name") || "").trim();
          var userName = (context.getVariable("request.formparam.username") || "").trim() || email;

          var clientId = context.getVariable("request.formparam.client_id") || "";
          var redirectUri = context.getVariable("request.formparam.redirect_uri") || "";
          var responseType = context.getVariable("request.formparam.response_type") || "code";
          var scope = context.getVariable("request.formparam.scope") || "openid profile email";
          var state = context.getVariable("request.formparam.state") || "";
          var codeChallenge = context.getVariable("request.formparam.code_challenge") || "";
          var codeChallengeMethod = context.getVariable("request.formparam.code_challenge_method") || "S256";

          context.setVariable("reg_client_id", clientId);
          context.setVariable("reg_redirect_uri", redirectUri);
          context.setVariable("reg_response_type", responseType);
          context.setVariable("reg_scope", scope);
          context.setVariable("reg_state", state);
          context.setVariable("reg_code_challenge", codeChallenge);
          context.setVariable("reg_code_challenge_method", codeChallengeMethod);

          if (!email || !password || !firstName || !lastName) {
            context.setVariable("reg_syntax_valid", "false");
            context.setVariable("reg_valid", "false");
            context.setVariable("reg_error_message", "All fields are required.");
            return;
          }

          if (password.length < 8) {
            context.setVariable("reg_syntax_valid", "false");
            context.setVariable("reg_valid", "false");
            context.setVariable("reg_error_message", "Password must be at least 8 characters long.");
            return;
          }

          var salt = randHex(16);
          var hash = sha256(salt + ":" + password);
          var storedPayload = salt + ":" + hash;

          var b64Payload = b64Enc(storedPayload);

          var secretId = "pwd-" + email.replace(/[^a-zA-Z0-9_-]/g, "_");
          var mfaSecret = randBase32(16);
          var systemMfa = context.getVariable("system_mfa_enabled") === "true";

          context.setVariable("reg_user_email", email);
          context.setVariable("reg_first_name", firstName);
          context.setVariable("reg_last_name", lastName);
          context.setVariable("reg_user_name", userName);
          context.setVariable("reg_user_secret_id", secretId);
          context.setVariable("private.reg_password_hash", storedPayload);
          context.setVariable("private.reg_secret_base64_payload", b64Payload);
          context.setVariable("reg_mfa_secret", mfaSecret);
          context.setVariable("reg_mfa_enabled", systemMfa ? "true" : "false");
          context.setVariable("reg_syntax_valid", "true");

          })();
