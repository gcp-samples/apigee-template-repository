  - name: AM-ResetPasswordForm
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-ResetPasswordForm
        IgnoreUnresolvedVariables: "true"
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: |
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Reset Password | OpenID Connect IdP</title>
                <style>
                  :root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #0b0f19; --card: #111827; --border: #1f2937; --text: #f9fafb; --text-muted: #9ca3af; --input-bg: #1f2937; }
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
                  .container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 440px; padding: 36px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); }
                  .badge { display: inline-flex; align-items: center; background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 20px; border: 1px solid rgba(59, 130, 246, 0.3); }
                  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
                  p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
                  .form-group { margin-bottom: 18px; }
                  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
                  input[type="email"], input[type="password"] { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; color: #fff; font-size: 14px; outline: none; }
                  input:focus { border-color: var(--primary); }
                  .btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
                  .btn:hover { background: var(--primary-hover); }
                  .links { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 13px; }
                  .links a { color: var(--primary); text-decoration: none; }
                </style>
              </head>
              <body>
                <div class="container">
                  <span class="badge">Security & Password</span>
                  <h1>Reset Password</h1>
                  <p>Verify your existing password to establish a new password.</p>

                  <form action="/reset-password" method="POST">
                    <input type="hidden" name="client_id" value="{reset_client_id}">
                    <input type="hidden" name="redirect_uri" value="{reset_redirect_uri}">

                    <div class="form-group">
                      <label for="email">Email Address</label>
                      <input type="email" id="email" name="email" placeholder="user@example.com" required autofocus>
                    </div>

                    <div class="form-group">
                      <label for="current_password">Current Password</label>
                      <input type="password" id="current_password" name="current_password" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                      <label for="new_password">New Password</label>
                      <input type="password" id="new_password" name="new_password" minlength="8" placeholder="Minimum 8 characters" required>
                    </div>

                    <button type="submit" class="btn">Update Password</button>
                  </form>

                  <div class="links">
                    <a href="/authorize?client_id={reset_client_id}&redirect_uri={reset_redirect_uri}">Return to Sign In</a>
                  </div>
                </div>
              </body>
              </html>

  - name: JS-ProcessResetRequest
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessResetRequest
        DisplayName: JS-ProcessResetRequest
        Properties: {}
        Source: |
          (function() {
          var email = (context.getVariable("request.formparam.email") || "").trim().toLowerCase();
          var currentPassword = context.getVariable("request.formparam.current_password") || "";
          var newPassword = context.getVariable("request.formparam.new_password") || "";

          context.setVariable("reset_user_email", email);
          context.setVariable("auth_user_email", email);
          var secretId = "pwd-" + email.replace(/[^a-zA-Z0-9_-]/g, "_");
          context.setVariable("user_secret_id", secretId);
          context.setVariable("reg_user_secret_id", secretId);

          if (!email || !currentPassword || !newPassword) {
            context.setVariable("reset_syntax_valid", "false");
            context.setVariable("reset_valid", "false");
            context.setVariable("reset_error_message", "All fields are required.");
            return;
          }

          if (newPassword.length < 8) {
            context.setVariable("reset_syntax_valid", "false");
            context.setVariable("reset_valid", "false");
            context.setVariable("reset_error_message", "New password must be at least 8 characters long.");
            return;
          }

          context.setVariable("reset_syntax_valid", "true");

          })();
  - name: JS-VerifyAndHashNewPassword
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "300"
          name: JS-VerifyAndHashNewPassword
        DisplayName: JS-VerifyAndHashNewPassword
        Properties: {}
        Source: |
          (function() {
          function sha256(ascii) {
            function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
            var mathPow = Math.pow; var maxWord = mathPow(2, 32); var lengthProperty = 'length';
            var i, j; var result = ''; var words = []; var asciiBitLength = ascii[lengthProperty] * 8;
            var hash = []; var k = []; var primeCounter = 0; var isComposite = {};
            for (var candidate = 2; primeCounter < 64; candidate++) {
              if (!isComposite[candidate]) {
                for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
              }
            }
            ascii += '\x80'; while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
            for (i = 0; i < ascii[lengthProperty]; i++) {
              j = ascii.charCodeAt(i); if (j >> 8) return; words[i >> 2] |= j << ((3 - i % 4) * 8);
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength | 0);
            for (j = 0; j < words[lengthProperty];) {
              var w = words.slice(j, j += 16); var oldHash = hash; hash = hash.slice(0, 8);
              for (i = 0; i < 64; i++) {
                var s0 = rightRotate(w[i - 15], 7) ^ rightRotate(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                var s1 = rightRotate(w[i - 2], 17) ^ rightRotate(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
                var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
                var s1h = rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25);
                var s0h = rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22);
                var t1 = (i < 16 ? w[i] : (w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0)) + hash[7] + s1h + ch + k[i];
                var t2 = s0h + maj;
                hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
              }
              for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
            }
            for (i = 0; i < 8; i++) {
              for (var b = 3; b >= 0; b--) {
                var byteVal = (hash[i] >> (b * 8)) & 255;
                result += ((byteVal < 16 ? '0' : '') + byteVal.toString(16));
              }
            }
            return result;
          }

          function b64Dec(str) {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
            str = String(str).replace(/[^A-Za-z0-9\+\/\=]/g, "");
            var bytes = [];
            var idx = 0;
            while (idx < str.length) {
              var e1 = chars.indexOf(str.charAt(idx++));
              var e2 = chars.indexOf(str.charAt(idx++));
              var e3 = chars.indexOf(str.charAt(idx++));
              var e4 = chars.indexOf(str.charAt(idx++));
              var c1 = (e1 << 2) | (e2 >> 4);
              var c2 = ((e2 & 15) << 4) | (e3 >> 2);
              var c3 = ((e3 & 3) << 6) | e4;
              bytes.push(c1);
              if (e3 !== 64) bytes.push(c2);
              if (e4 !== 64) bytes.push(c3);
            }
            var out = "";
            var i = 0;
            while (i < bytes.length) {
              var b1 = bytes[i++];
              if (b1 < 128) out += String.fromCharCode(b1);
              else if (b1 > 191 && b1 < 224) { var b2 = bytes[i++]; out += String.fromCharCode(((b1 & 31) << 6) | (b2 & 63)); }
              else { var b2 = bytes[i++]; var b3 = bytes[i++]; out += String.fromCharCode(((b1 & 15) << 12) | ((b2 & 63) << 6) | (b3 & 63)); }
            }
            return out;
          }

          function b64Enc(str) {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
            var out = "";
            var u = [];
            for (var i = 0; i < str.length; i++) {
              var c = str.charCodeAt(i);
              if (c < 128) u.push(c);
              else if (c < 2048) { u.push((c >> 6) | 192); u.push((c & 63) | 128); }
              else { u.push((c >> 12) | 224); u.push(((c >> 6) & 63) | 128); u.push((c & 63) | 128); }
            }
            var idx = 0;
            while (idx < u.length) {
              var c1 = u[idx++];
              var c2 = idx < u.length ? u[idx++] : NaN;
              var c3 = idx < u.length ? u[idx++] : NaN;
              var e1 = c1 >> 2;
              var e2 = ((c1 & 3) << 4) | (isNaN(c2) ? 0 : c2 >> 4);
              var e3 = isNaN(c2) ? 64 : (((c2 & 15) << 2) | (isNaN(c3) ? 0 : c3 >> 6));
              var e4 = isNaN(c3) ? 64 : c3 & 63;
              out += chars.charAt(e1) + chars.charAt(e2) + chars.charAt(e3) + chars.charAt(e4);
            }
            return out;
          }

          function randHex(len) {
            var chars = "abcdef0123456789";
            var str = "";
            for (var i = 0; i < len; i++) str += chars.charAt(Math.floor(Math.random() * chars.length));
            return str;
          }

          var devResContent = context.getVariable("getDevUserRes.content");
          var devUserFound = false;
          if (devResContent) {
            try {
              var dev = JSON.parse(devResContent);
              if (dev.email) devUserFound = true;
            } catch (e) {}
          }

          if (!devUserFound) {
            context.setVariable("reset_valid", "false");
            context.setVariable("reset_error_message", "Invalid email address or credentials.");
            return;
          }

          var currentPassword = context.getVariable("request.formparam.current_password") || "";
          var newPassword = context.getVariable("request.formparam.new_password") || "";
          var storedHash = "";
          var storageType = context.getVariable("password_storage_type");

          if (storageType === "secret-manager") {
            var smRes = context.getVariable("getSecretRes.content");
            if (smRes) {
              try {
                var smData = JSON.parse(smRes);
                var b64Data = smData.payload && smData.payload.data;
                if (b64Data) {
                  storedHash = b64Dec(b64Data).trim();
                }
              } catch (smErr) {}
            }
          } else {
            storedHash = (context.getVariable("private.stored_password_hash") || "").trim();
          }

          if (!storedHash || storedHash.indexOf(":") === -1) {
            context.setVariable("reset_valid", "false");
            context.setVariable("reset_error_message", "Stored password not found.");
            return;
          }

          var parts = storedHash.split(":");
          var currentSalt = parts[0];
          var expectedHash = parts[1];

          if (sha256(currentSalt + ":" + currentPassword) !== expectedHash) {
            context.setVariable("reset_valid", "false");
            context.setVariable("reset_error_message", "Current password does not match.");
            return;
          }

          var newSalt = randHex(16);
          var newHash = sha256(newSalt + ":" + newPassword);
          var newStoredPayload = newSalt + ":" + newHash;
          var b64Payload = b64Enc(newStoredPayload);

          var email = context.getVariable("reset_user_email");
