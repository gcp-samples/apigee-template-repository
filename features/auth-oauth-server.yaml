# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: auth-oauth-server
displayName: OAuth 2.1 & OIDC Identity Provider
type: feature
description: Complete OAuth 2.1 Authorization Server & OpenID Connect (OIDC) Identity Provider (IdP) supporting Apigee X developers as user store, configurable password storage (Cloud Secret Manager or KVM), client storage in KVM (OAuthClients), multi-factor authentication (authenticator apps TOTP), self-service HTML flows (sign-in, registration, password reset, delete account), Dynamic Client Registration (DCR), and PKCE.
documentation: ""
categories:
  - security
  - oauth2
  - oidc
  - identity
  - mcp
parameters:
  - name: ISSUER_URL
    displayName: Issuer URL
    description: Base URL of the OAuth authorization server (e.g. https://api.example.com). If empty, dynamically derived from request scheme and host.
    default: ""
  - name: APIGEE_API_HOST
    displayName: Apigee API Base URL
    description: Base host for Apigee X Management API ServiceCallouts
    default: apigee.googleapis.com/v1
  - name: DEFAULT_DEVELOPER_EMAIL
    displayName: Default Developer Email
    description: Developer email in Apigee X used for Dynamic Client Registration (DCR) apps
    default: mcp-clients@apigee.internal
  - name: DEFAULT_API_PRODUCT
    displayName: Default API Product
    description: API Product to associate with newly registered DCR client apps (optional)
    default: ""
  - name: JWT_SIGNING_SECRET
    displayName: JWT Signing Secret
    description: Secret key used to sign HS256 JWT tokens
    default: apigee-oauth21-default-secure-secret-key-32bytes-min
  - name: ACCESS_TOKEN_FORMAT
    displayName: Access Token Format
    description: Format of issued access tokens ('jwt', 'opaque', or 'auto'). 'auto' uses JWT for CIMD URL clients and opaque for registered Apigee Apps.
    default: jwt
  - name: SUPPORTED_SCOPES
    displayName: Supported Scopes
    description: Space-separated list of OAuth scopes supported by this server
    default: mcp openid profile email read write
  - name: PASSWORD_STORAGE
    displayName: Password Storage Backend
    description: Backend used to store user passwords ('kvm' or 'secret-manager')
    default: kvm
  - name: ENABLE_MFA
    displayName: Enable Multi-Factor Authentication
    description: Enforce TOTP multi-factor authentication (authenticator apps) for user sign-in ('true' or 'false')
    default: "false"
  - name: MFA_ISSUER_NAME
    displayName: MFA Issuer Name
    description: Issuer label displayed in authenticator apps (e.g. Google Authenticator)
    default: ApigeeIdP
endpoints:
  - name: oauth
    basePath: /
    routes:
      - name: default
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: CORS-SetCors
          - name: JS-InitOAuthEnv

      - name: GET OAuth Protected Resource Metadata
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/.well-known/oauth-protected-resource") and (request.verb = "GET")
        steps:
          - name: JS-BuildProtectedResourceMetadata

      - name: GET OAuth Authorization Server Metadata
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/.well-known/oauth-authorization-server") and (request.verb = "GET")
        steps:
          - name: JS-BuildAuthServerMetadata

      - name: GET OpenID Configuration
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/.well-known/openid-configuration") and (request.verb = "GET")
        steps:
          - name: JS-BuildOidcConfig

      - name: GET JWKS
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/jwks.json") and (request.verb = "GET")
        steps:
          - name: JS-BuildJwksResponse

      - name: POST Dynamic Client Registration
        mode: Response
        condition: ((proxy.pathsuffix MatchesPath "/register") or (proxy.pathsuffix MatchesPath "/register-client")) and (request.verb = "POST")
        steps:
          - name: JS-ProcessDCRRequest
          - name: KVM-PutOAuthClient
            condition: dcr_success = "true"
          - name: PC-StoreClient
            condition: dcr_success = "true"
          - name: AM-RegisterSuccess
            condition: dcr_success = "true"
          - name: AM-RegisterFailure
            condition: dcr_success = "false"

      - name: GET Authorize (Sign-In Page)
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/authorize") and (request.verb = "GET")
        steps:
          - name: JS-ExtractAuthorizeParams
          - name: LC-LookupCIMD
            condition: is_cimd = "true"
          - name: SC-FetchCIMD
            condition: (is_cimd = "true") and (cimd_doc_cached = null)
          - name: LC-LookupClient
            condition: is_cimd = "false"
          - name: KVM-GetOAuthClient
            condition: (is_cimd = "false") and (client_record_cached = null) and (client_id_to_lookup != null)
          - name: SC-GetApigeeApp
            condition: (is_cimd = "false") and (client_record_cached = null) and (kvm_client_record = null) and (client_id_to_lookup != null)
          - name: JS-ValidateAuthorize
          - name: AM-AuthorizeForm

      - name: POST Authorize (Sign-In and MFA Authentication)
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/authorize") and (request.verb = "POST")
        steps:
          - name: JS-ExtractAuthorizeParams
          - name: LC-LookupCIMD
            condition: is_cimd = "true"
          - name: SC-FetchCIMD
            condition: (is_cimd = "true") and (cimd_doc_cached = null)
          - name: LC-LookupClient
            condition: is_cimd = "false"
          - name: KVM-GetOAuthClient
            condition: (is_cimd = "false") and (client_record_cached = null) and (client_id_to_lookup != null)
          - name: SC-GetApigeeApp
            condition: (is_cimd = "false") and (client_record_cached = null) and (kvm_client_record = null) and (client_id_to_lookup != null)
          - name: JS-ValidateAuthorize
          - name: JS-PrepUserLookup
            condition: authorize_valid = "true"
          - name: SC-GetDeveloperUser
            condition: (authorize_valid = "true") and (auth_user_email != null)
          - name: KVM-GetPassword
            condition: (authorize_valid = "true") and (password_storage_type = "kvm") and (getDevUserRes.status.code = 200)
          - name: SC-GetSecretManagerPassword
            condition: (authorize_valid = "true") and (password_storage_type = "secret-manager") and (getDevUserRes.status.code = 200)
          - name: JS-VerifyUserCredentials
            condition: authorize_valid = "true"
          - name: AM-MFAChallengeForm
            condition: mfa_challenge_needed = "true"
          - name: PC-StoreCode
            condition: (authorize_valid = "true") and (auth_success = "true")
          - name: AM-AuthorizeRedirect
            condition: (authorize_valid = "true") and (auth_success = "true")
          - name: AM-AuthorizeErrorResponse
            condition: ((authorize_valid = "false") or (auth_success = "false")) and (mfa_challenge_needed != "true")

      - name: GET Register User Page
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/register-user") and (request.verb = "GET")
        steps:
          - name: JS-ExtractRegisterParams
          - name: AM-RegisterUserForm

      - name: POST Register User
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/register-user") and (request.verb = "POST")
        steps:
          - name: JS-ProcessRegisterUserRequest
          - name: SC-CheckDeveloperExists
            condition: reg_syntax_valid = "true"
          - name: JS-ValidateNewUser
            condition: reg_syntax_valid = "true"
          - name: SC-CreateDeveloperUser
            condition: reg_valid = "true"
          - name: KVM-PutPassword
            condition: (reg_valid = "true") and (password_storage_type = "kvm")
          - name: SC-CreateSecretManagerSecret
            condition: (reg_valid = "true") and (password_storage_type = "secret-manager")
          - name: SC-AddSecretManagerVersion
            condition: (reg_valid = "true") and (password_storage_type = "secret-manager")
          - name: JS-PrepareRegisterResponse
          - name: AM-MFASetupPage
            condition: (reg_valid = "true") and (reg_mfa_enabled = "true")
          - name: AM-RegisterUserSuccess
            condition: (reg_valid = "true") and (reg_mfa_enabled = "false")
          - name: AM-RegisterUserFailure
            condition: reg_valid = "false"

      - name: GET or POST MFA Setup
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/mfa-setup") and ((request.verb = "GET") or (request.verb = "POST"))
        steps:
          - name: JS-ProcessMFASetup
          - name: SC-GetDeveloperUser
            condition: (mfa_verify_action = "confirm") and (auth_user_email != null) and (auth_user_email != "")
          - name: JS-VerifyMFACodeAndActivate
            condition: mfa_verify_action = "confirm"
          - name: SC-UpdateDeveloperUser
            condition: mfa_confirmed = "true"
          - name: AM-MFASetupPage
            condition: (request.verb = "GET") or (mfa_confirmed != "true")
          - name: AM-MFAConfirmedPage
            condition: mfa_confirmed = "true"

      - name: GET Reset Password Page
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/reset-password") and (request.verb = "GET")
        steps:
          - name: JS-ExtractResetParams
          - name: AM-ResetPasswordForm

      - name: POST Reset Password
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/reset-password") and (request.verb = "POST")
        steps:
          - name: JS-ProcessResetRequest
          - name: SC-GetDeveloperUser
            condition: reset_syntax_valid = "true"
          - name: KVM-GetPassword
            condition: (reset_syntax_valid = "true") and (password_storage_type = "kvm") and (getDevUserRes.status.code = 200)
          - name: SC-GetSecretManagerPassword
            condition: (reset_syntax_valid = "true") and (password_storage_type = "secret-manager") and (getDevUserRes.status.code = 200)
          - name: JS-VerifyAndHashNewPassword
            condition: reset_syntax_valid = "true"
          - name: KVM-PutPassword
            condition: (reset_valid = "true") and (password_storage_type = "kvm")
          - name: SC-AddSecretManagerVersion
            condition: (reset_valid = "true") and (password_storage_type = "secret-manager")
          - name: AM-ResetPasswordSuccess
            condition: reset_valid = "true"
          - name: AM-ResetPasswordFailure
            condition: reset_valid = "false"

      - name: GET Delete Account Page
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/delete-account") and (request.verb = "GET")
        steps:
          - name: JS-ExtractDeleteParams
          - name: AM-DeleteAccountForm

      - name: POST Delete Account
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/delete-account") and (request.verb = "POST")
        steps:
          - name: JS-ProcessDeleteRequest
          - name: SC-GetDeveloperUser
            condition: delete_syntax_valid = "true"
          - name: KVM-GetPassword
            condition: (delete_syntax_valid = "true") and (password_storage_type = "kvm") and (getDevUserRes.status.code = 200)
          - name: SC-GetSecretManagerPassword
            condition: (delete_syntax_valid = "true") and (password_storage_type = "secret-manager") and (getDevUserRes.status.code = 200)
          - name: JS-VerifyDeleteAccount
            condition: delete_syntax_valid = "true"
          - name: SC-DeleteDeveloperUser
            condition: delete_valid = "true"
          - name: SC-DeleteSecretManagerSecret
            condition: (delete_valid = "true") and (password_storage_type = "secret-manager")
          - name: AM-DeleteAccountSuccess
            condition: delete_valid = "true"
          - name: AM-DeleteAccountFailure
            condition: delete_valid = "false"

      - name: POST Token
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/token") and (request.verb = "POST")
        steps:
          - name: JS-ExtractTokenParams
          - name: LC-LookupCode
            condition: token_grant_type = "authorization_code"
          - name: LC-LookupRefreshToken
            condition: token_grant_type = "refresh_token"
          - name: LC-LookupCIMD
            condition: (token_grant_type = "client_credentials") and (is_cimd = "true")
          - name: SC-FetchCIMD
            condition: (token_grant_type = "client_credentials") and (is_cimd = "true") and (cimd_doc_cached = null)
          - name: LC-LookupClient
            condition: (token_grant_type = "client_credentials") and (is_cimd = "false")
          - name: KVM-GetOAuthClient
            condition: (token_grant_type = "client_credentials") and (is_cimd = "false") and (client_record_cached = null) and (client_id_to_lookup != null)
          - name: SC-GetApigeeApp
            condition: (token_grant_type = "client_credentials") and (is_cimd = "false") and (client_record_cached = null) and (kvm_client_record = null) and (client_id_to_lookup != null)
          - name: JS-VerifyTokenRequest
          - name: IC-InvalidateCode
            condition: (token_grant_type = "authorization_code") and (token_generation_allowed = "true")
          - name: IC-InvalidateRefreshToken
            condition: (token_grant_type = "refresh_token") and (token_generation_allowed = "true")
          - name: JWT-GenerateAccessToken
            condition: (token_generation_allowed = "true") and (token_format_to_issue = "jwt")
          - name: JWT-GenerateIDToken
            condition: (token_generation_allowed = "true") and (token_scope_has_openid = "true")
          - name: JS-FinalizeTokenResponse
            condition: token_generation_allowed = "true"
          - name: PC-StoreOpaqueAccessToken
            condition: (token_generation_allowed = "true") and (token_format_to_issue = "opaque")
          - name: PC-StoreRefreshToken
            condition: token_generation_allowed = "true"
          - name: AM-TokenResponse
            condition: token_generation_allowed = "true"
          - name: AM-TokenErrorResponse
            condition: (token_generation_allowed = "false") or (token_error != null)

      - name: POST Introspect
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/introspect") and (request.verb = "POST")
        steps:
          - name: JS-ExtractIntrospectParams
          - name: LC-LookupOpaqueIntrospectToken
            condition: (introspect_token != null) and (introspect_token_format = "opaque")
          - name: JWT-VerifyIntrospectToken
            condition: (introspect_token != null) and (introspect_token_format = "jwt")
          - name: JS-FormatIntrospectResponse

      - name: GET or POST UserInfo
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/userinfo") and ((request.verb = "GET") or (request.verb = "POST"))
        steps:
          - name: JS-ExtractBearerToken
          - name: LC-LookupOpaqueUserInfoToken
            condition: (bearer_token != null) and (userinfo_token_format = "opaque")
          - name: JWT-VerifyUserInfoToken
            condition: (bearer_token != null) and (userinfo_token_format = "jwt")
          - name: JS-FormatUserInfoResponse
            condition: bearer_token != null
          - name: AM-UserInfoResponse
            condition: userinfo_valid = "true"
          - name: AM-UserInfoErrorResponse
            condition: userinfo_valid = "false"

      - name: POST Revoke
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/revoke") and (request.verb = "POST")
        steps:
          - name: JS-ProcessRevocation
          - name: IC-InvalidateRevokedOpaqueAccessToken
            condition: revoke_token_type = "access_token"
          - name: IC-InvalidateRevokedRefreshToken
            condition: revoke_token_type = "refresh_token"
          - name: IC-InvalidateRevokedCode
            condition: revoke_token_type = "code"
          - name: AM-RevokeSuccess
    faultRules: []
targets: []
policies:
  - name: CORS-SetCors
    type: CORS
    content:
      CORS:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: CORS-SetCors
        DisplayName: CORS-SetCors
        AllowOrigins: "{request.header.origin}"
        AllowMethods: GET, PUT, POST, DELETE, OPTIONS
        AllowHeaders: "*"
        ExposeHeaders: "*"
        MaxAge: "3628800"
        AllowCredentials: "true"
        GeneratePreflightResponse: "true"
        IgnoreUnresolvedVariables: "true"

  - name: JS-InitOAuthEnv
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-InitOAuthEnv
        DisplayName: JS-InitOAuthEnv
        Properties: {}
        Source: |
          var paramIssuer = (context.getVariable("ISSUER_URL") || "{ISSUER_URL}" || "").trim();
          if (paramIssuer.indexOf("{") === 0) paramIssuer = "";
          var scheme = context.getVariable("client.scheme") || "https";
          var host = context.getVariable("request.header.host") || "localhost";
          var computedIssuer = paramIssuer || (scheme + "://" + host);

          context.setVariable("oauth_issuer_url", computedIssuer);

          var apiHost = (context.getVariable("APIGEE_API_HOST") || "{APIGEE_API_HOST}" || "apigee.googleapis.com/v1").trim();
          if (apiHost.indexOf("{") === 0) apiHost = "apigee.googleapis.com/v1";
          apiHost = apiHost.replace(/^https?:\/\//i, "");
          context.setVariable("apigee_api_host", apiHost);

          var devEmail = (context.getVariable("DEFAULT_DEVELOPER_EMAIL") || "{DEFAULT_DEVELOPER_EMAIL}" || "mcp-clients@apigee.internal").trim();
          if (devEmail.indexOf("{") === 0) devEmail = "mcp-clients@apigee.internal";
          context.setVariable("default_dev_email", devEmail);

          var apiProduct = (context.getVariable("DEFAULT_API_PRODUCT") || "{DEFAULT_API_PRODUCT}" || "").trim();
          if (apiProduct.indexOf("{") === 0) apiProduct = "";
          context.setVariable("default_api_product", apiProduct);

          var jwtSecret = (context.getVariable("JWT_SIGNING_SECRET") || "{JWT_SIGNING_SECRET}" || "apigee-oauth21-default-secure-secret-key-32bytes-min").trim();
          if (jwtSecret.indexOf("{") === 0) jwtSecret = "apigee-oauth21-default-secure-secret-key-32bytes-min";
          context.setVariable("private.jwt_signing_secret", jwtSecret);

          var tokenFormatParam = (context.getVariable("ACCESS_TOKEN_FORMAT") || "{ACCESS_TOKEN_FORMAT}" || "jwt").trim().toLowerCase();
          if (tokenFormatParam.indexOf("{") === 0 || (tokenFormatParam !== "opaque" && tokenFormatParam !== "auto")) {
            tokenFormatParam = "jwt";
          }
          context.setVariable("oauth_token_format_pref", tokenFormatParam);

          var supportedScopes = (context.getVariable("SUPPORTED_SCOPES") || "{SUPPORTED_SCOPES}" || "mcp openid profile email read write").trim();
          if (supportedScopes.indexOf("{") === 0) supportedScopes = "mcp openid profile email read write";
          context.setVariable("supported_scopes", supportedScopes);

          var pwdStorage = (context.getVariable("PASSWORD_STORAGE") || "{PASSWORD_STORAGE}" || "kvm").trim().toLowerCase();
          if (pwdStorage !== "secret-manager") {
            pwdStorage = "kvm";
          }
          context.setVariable("password_storage_type", pwdStorage);

          var enableMfa = (context.getVariable("ENABLE_MFA") || "{ENABLE_MFA}" || "false").trim().toLowerCase();
          context.setVariable("system_mfa_enabled", enableMfa === "true" ? "true" : "false");

          var mfaIssuer = (context.getVariable("MFA_ISSUER_NAME") || "{MFA_ISSUER_NAME}" || "ApigeeIdP").trim();
          if (mfaIssuer.indexOf("{") === 0) mfaIssuer = "ApigeeIdP";
          context.setVariable("mfa_issuer_name", mfaIssuer);

  - name: JS-BuildProtectedResourceMetadata
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildProtectedResourceMetadata
        DisplayName: JS-BuildProtectedResourceMetadata
        Properties: {}
        Source: |
          var issuer = context.getVariable("oauth_issuer_url");
          var scopesStr = context.getVariable("supported_scopes") || "mcp openid profile email read write";
          var scopes = scopesStr.split(/\s+/).filter(Boolean);

          var metadata = {
            "resource": issuer + "/mcp",
            "authorization_servers": [issuer],
            "scopes_supported": scopes,
            "bearer_methods_supported": ["header"],
            "resource_documentation": issuer + "/docs"
          };

          context.setVariable("response.content", JSON.stringify(metadata, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-BuildAuthServerMetadata
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildAuthServerMetadata
        DisplayName: JS-BuildAuthServerMetadata
        Properties: {}
        Source: |
          var issuer = context.getVariable("oauth_issuer_url");
          var scopesStr = context.getVariable("supported_scopes") || "mcp openid profile email read write";
          var scopes = scopesStr.split(/\s+/).filter(Boolean);

          var metadata = {
            "issuer": issuer,
            "authorization_endpoint": issuer + "/authorize",
            "token_endpoint": issuer + "/token",
            "registration_endpoint": issuer + "/register",
            "introspection_endpoint": issuer + "/introspect",
            "revocation_endpoint": issuer + "/revoke",
            "userinfo_endpoint": issuer + "/userinfo",
            "jwks_uri": issuer + "/jwks.json",
            "scopes_supported": scopes,
            "response_types_supported": ["code"],
            "response_modes_supported": ["query"],
            "grant_types_supported": ["authorization_code", "refresh_token", "client_credentials"],
            "token_endpoint_auth_methods_supported": ["none", "client_secret_post", "client_secret_basic"],
            "code_challenge_methods_supported": ["S256", "plain"],
            "client_id_metadata_document_supported": true
          };

          context.setVariable("response.content", JSON.stringify(metadata, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-BuildOidcConfig
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildOidcConfig
        DisplayName: JS-BuildOidcConfig
        Properties: {}
        Source: |
          var issuer = context.getVariable("oauth_issuer_url");
          var scopesStr = context.getVariable("supported_scopes") || "mcp openid profile email read write";
          var scopes = scopesStr.split(/\s+/).filter(Boolean);

          var oidcConfig = {
            "issuer": issuer,
            "authorization_endpoint": issuer + "/authorize",
            "token_endpoint": issuer + "/token",
            "userinfo_endpoint": issuer + "/userinfo",
            "jwks_uri": issuer + "/jwks.json",
            "registration_endpoint": issuer + "/register",
            "user_registration_endpoint": issuer + "/register-user",
            "password_reset_endpoint": issuer + "/reset-password",
            "delete_account_endpoint": issuer + "/delete-account",
            "mfa_setup_endpoint": issuer + "/mfa-setup",
            "scopes_supported": scopes,
            "response_types_supported": ["code"],
            "grant_types_supported": ["authorization_code", "refresh_token", "client_credentials"],
            "subject_types_supported": ["public"],
            "id_token_signing_alg_values_supported": ["HS256"],
            "claims_supported": [
              "sub",
              "iss",
              "aud",
              "exp",
              "iat",
              "auth_time",
              "name",
              "given_name",
              "family_name",
              "preferred_username",
              "email",
              "email_verified"
            ],
            "code_challenge_methods_supported": ["S256", "plain"]
          };

          context.setVariable("response.content", JSON.stringify(oidcConfig, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-BuildJwksResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildJwksResponse
        DisplayName: JS-BuildJwksResponse
        Properties: {}
        Source: |
          var jwks = {
            "keys": [
              {
                "kty": "oct",
                "use": "sig",
                "alg": "HS256",
                "kid": "apigee-oauth21-key-1"
              }
            ]
          };
          context.setVariable("response.content", JSON.stringify(jwks, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-ProcessDCRRequest
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessDCRRequest
        DisplayName: JS-ProcessDCRRequest
        Properties: {}
        Source: |
          try {
            var bodyStr = context.getVariable("request.content") || "{}";
            var body = JSON.parse(bodyStr);

            var clientName = (body.client_name || "MCP Client").trim();
            var redirectUris = body.redirect_uris;

            if (!redirectUris || !Array.isArray(redirectUris) || redirectUris.length === 0) {
              throw new Error("Missing required 'redirect_uris' array.");
            }

            function randHex(len) {
              var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
              var str = "";
              for (var i = 0; i < len; i++) {
                str += chars.charAt(Math.floor(Math.random() * chars.length));
              }
              return str;
            }

            var clientId = "client_" + randHex(16);
            var clientSecret = "sec_" + randHex(32);

            var grantTypes = body.grant_types || ["authorization_code", "refresh_token", "client_credentials"];
            var responseTypes = body.response_types || ["code"];
            var scope = body.scope || context.getVariable("supported_scopes") || "mcp openid profile email";
            var tokenEndpointAuthMethod = body.token_endpoint_auth_method || "client_secret_post";

            var clientRecord = {
              "client_id": clientId,
              "client_secret": clientSecret,
              "client_name": clientName,
              "redirect_uris": redirectUris,
              "grant_types": grantTypes,
              "response_types": responseTypes,
              "scope": scope,
              "token_endpoint_auth_method": tokenEndpointAuthMethod,
              "client_id_issued_at": Math.floor(Date.now() / 1000)
            };

            var recordData = JSON.stringify(clientRecord);
            context.setVariable("client_id_to_lookup", clientId);
            context.setVariable("client_record_data", recordData);
            context.setVariable("dcr_response_json", JSON.stringify(clientRecord, null, 2));
            context.setVariable("dcr_success", "true");
            context.setVariable("dcr_error", "");
          } catch (e) {
            context.setVariable("dcr_success", "false");
            context.setVariable("dcr_error", "invalid_client_metadata");
            context.setVariable("dcr_error_description", e.message || String(e));
          }

