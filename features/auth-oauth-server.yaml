  - name: JS-ProcessDeleteRequest
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessDeleteRequest
        DisplayName: JS-ProcessDeleteRequest
        Properties: {}
        Source: |
          (function() {
          var email = (context.getVariable("request.formparam.email") || "").trim().toLowerCase();
          var password = context.getVariable("request.formparam.password") || "";

          context.setVariable("delete_user_email", email);
          context.setVariable("auth_user_email", email);
          var secretId = "pwd-" + email.replace(/[^a-zA-Z0-9_-]/g, "_");
          context.setVariable("user_secret_id", secretId);
          context.setVariable("delete_user_secret_id", secretId);

          if (!email || !password) {
            context.setVariable("delete_syntax_valid", "false");
            context.setVariable("delete_valid", "false");
            context.setVariable("delete_error_message", "Email and password are required.");
            return;
          }

          context.setVariable("delete_syntax_valid", "true");

          })();
  - name: JS-VerifyDeleteAccount
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "300"
          name: JS-VerifyDeleteAccount
        DisplayName: JS-VerifyDeleteAccount
        Properties: {}
        Source: |
          (function() {
          function b64Dec(str) {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
            str = String(str).replace(/[^A-Za-z0-9\+\/\=]/g, "");
            var bytes = [];
            var idx = 0;
            while (idx < str.length) {
              var e1 = chars.indexOf(str.charAt(idx++));
              var e2 = chars.indexOf(str.charAt(idx++));
              var e3 = chars.indexOf(str.charAt(idx++));
              var e4 = chars.indexOf(str.charAt(idx++));
              var c1 = (e1 << 2) | (e2 >> 4);
              var c2 = ((e2 & 15) << 4) | (e3 >> 2);
              var c3 = ((e3 & 3) << 6) | e4;
              bytes.push(c1);
              if (e3 !== 64) bytes.push(c2);
              if (e4 !== 64) bytes.push(c3);
            }
            var out = "";
            var i = 0;
            while (i < bytes.length) {
              var b1 = bytes[i++];
              if (b1 < 128) out += String.fromCharCode(b1);
              else if (b1 > 191 && b1 < 224) { var b2 = bytes[i++]; out += String.fromCharCode(((b1 & 31) << 6) | (b2 & 63)); }
              else { var b2 = bytes[i++]; var b3 = bytes[i++]; out += String.fromCharCode(((b1 & 15) << 12) | ((b2 & 63) << 6) | (b3 & 63)); }
            }
            return out;
          }
          function sha256(ascii) {
            function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
            var mathPow = Math.pow; var maxWord = mathPow(2, 32); var lengthProperty = 'length';
            var i, j; var result = ''; var words = []; var asciiBitLength = ascii[lengthProperty] * 8;
            var hash = []; var k = []; var primeCounter = 0; var isComposite = {};
            for (var candidate = 2; primeCounter < 64; candidate++) {
              if (!isComposite[candidate]) {
                for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
              }
            }
            ascii += '\x80'; while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
            for (i = 0; i < ascii[lengthProperty]; i++) {
              j = ascii.charCodeAt(i); if (j >> 8) return; words[i >> 2] |= j << ((3 - i % 4) * 8);
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength | 0);
            for (j = 0; j < words[lengthProperty];) {
              var w = words.slice(j, j += 16); var oldHash = hash; hash = hash.slice(0, 8);
              for (i = 0; i < 64; i++) {
                var s0 = rightRotate(w[i - 15], 7) ^ rightRotate(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                var s1 = rightRotate(w[i - 2], 17) ^ rightRotate(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
                var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
                var s1h = rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25);
                var s0h = rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22);
                var t1 = (i < 16 ? w[i] : (w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0)) + hash[7] + s1h + ch + k[i];
                var t2 = s0h + maj;
                hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
              }
              for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
            }
            for (i = 0; i < 8; i++) {
              for (var b = 3; b >= 0; b--) {
                var byteVal = (hash[i] >> (b * 8)) & 255;
                result += ((byteVal < 16 ? '0' : '') + byteVal.toString(16));
              }
            }
            return result;
          }

          var devResContent = context.getVariable("getDevUserRes.content");
          var devUserFound = false;
          if (devResContent) {
            try {
              var dev = JSON.parse(devResContent);
              if (dev.email) devUserFound = true;
            } catch (e) {}
          }

          if (!devUserFound) {
            context.setVariable("delete_valid", "false");
            context.setVariable("delete_error_message", "Account not found or invalid credentials.");
            return;
          }

          var inputPassword = context.getVariable("request.formparam.password") || "";
          var storedHash = "";
          var storageType = context.getVariable("password_storage_type");

          if (storageType === "secret-manager") {
            var smRes = context.getVariable("getSecretRes.content");
            if (smRes) {
              try {
                var smData = JSON.parse(smRes);
                var b64Data = smData.payload && smData.payload.data;
                if (b64Data) {
                  storedHash = b64Dec(b64Data).trim();
                }
              } catch (smErr) {}
            }
          } else {
            storedHash = (context.getVariable("private.stored_password_hash") || "").trim();
          }

          if (!storedHash || storedHash.indexOf(":") === -1) {
            context.setVariable("delete_valid", "false");
            context.setVariable("delete_error_message", "Credentials record not found.");
            return;
          }

          var parts = storedHash.split(":");
          var currentSalt = parts[0];
          var expectedHash = parts[1];

          if (sha256(currentSalt + ":" + inputPassword) !== expectedHash) {
            context.setVariable("delete_valid", "false");
            context.setVariable("delete_error_message", "Password verification failed.");
            return;
          }

          context.setVariable("delete_valid", "true");

          })();
