  - name: JS-VerifyUserCredentials
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "300"
          name: JS-VerifyUserCredentials
        DisplayName: JS-VerifyUserCredentials
        Properties: {}
        Source: |
          (function() {
          // --- SHA-256 implementation ---
          function sha256(ascii) {
            function rightRotate(value, amount) {
              return (value >>> amount) | (value << (32 - amount));
            }
            var mathPow = Math.pow;
            var maxWord = mathPow(2, 32);
            var lengthProperty = 'length';
            var i, j;
            var result = '';
            var words = [];
            var asciiBitLength = ascii[lengthProperty] * 8;
            var hash = [];
            var k = [];
            var primeCounter = 0;
            var isComposite = {};
            for (var candidate = 2; primeCounter < 64; candidate++) {
              if (!isComposite[candidate]) {
                for (i = 0; i < 313; i += candidate) {
                  isComposite[i] = candidate;
                }
                hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
              }
            }
            ascii += '\x80';
            while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
            for (i = 0; i < ascii[lengthProperty]; i++) {
              j = ascii.charCodeAt(i);
              if (j >> 8) return;
              words[i >> 2] |= j << ((3 - i % 4) * 8);
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength | 0);
            for (j = 0; j < words[lengthProperty];) {
              var w = words.slice(j, j += 16);
              var oldHash = hash;
              hash = hash.slice(0, 8);
              for (i = 0; i < 64; i++) {
                var s0 = rightRotate(w[i - 15], 7) ^ rightRotate(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                var s1 = rightRotate(w[i - 2], 17) ^ rightRotate(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                var ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
                var maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
                var s1h = rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25);
                var s0h = rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22);
                var t1 = (i < 16 ? w[i] : (w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0)) + hash[7] + s1h + ch + k[i];
                var t2 = s0h + maj;
                hash = [(t1 + t2) | 0].concat(hash);
                hash[4] = (hash[4] + t1) | 0;
              }
              for (i = 0; i < 8; i++) {
                hash[i] = (hash[i] + oldHash[i]) | 0;
              }
            }
            for (i = 0; i < 8; i++) {
              for (var b = 3; b >= 0; b--) {
                var byteVal = (hash[i] >> (b * 8)) & 255;
                result += ((byteVal < 16 ? '0' : '') + byteVal.toString(16));
              }
            }
            return result;
          }

          // --- HMAC-SHA1 and TOTP implementation ---
          function base32Decode(str) {
            var b32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            var cleanStr = str.toUpperCase().replace(/=+$/, "");
            var bits = 0, val = 0;
            var out = [];
            for (var i = 0; i < cleanStr.length; i++) {
              var idx = b32.indexOf(cleanStr.charAt(i));
              if (idx === -1) continue;
              val = (val << 5) | idx;
              bits += 5;
              if (bits >= 8) {
                out.push((val >>> (bits - 8)) & 255);
                bits -= 8;
              }
            }
            return out;
          }

          function sha1Block(words) {
            var h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
            var w = new Array(80);
            for (var i = 0; i < words.length; i += 16) {
              for (var t = 0; t < 16; t++) w[t] = words[i + t] | 0;
              for (var t = 16; t < 80; t++) {
                var s = w[t - 3] ^ w[t - 8] ^ w[t - 14] ^ w[t - 16];
                w[t] = (s << 1) | (s >>> 31);
              }
              var a = h0, b = h1, c = h2, d = h3, e = h4;
              for (var t = 0; t < 80; t++) {
                var f, k;
                if (t < 20) { f = (b & c) | ((~b) & d); k = 0x5A827999; }
                else if (t < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
                else if (t < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
                else { f = b ^ c ^ d; k = 0xCA62C1D6; }
                var temp = (((a << 5) | (a >>> 27)) + f + e + k + w[t]) | 0;
                e = d; d = c; c = (b << 30) | (b >>> 2); b = a; a = temp;
              }
              h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
            }
            return [h0, h1, h2, h3, h4];
          }

          function hmacSha1(keyBytes, msgBytes) {
            var k = keyBytes.slice();
            if (k.length > 64) {
              var kw = bytesToWords(k, k.length * 8);
              var kh = sha1Block(kw);
              k = [];
              for (var i = 0; i < 5; i++) {
                for (var b = 3; b >= 0; b--) k.push((kh[i] >>> (b * 8)) & 255);
              }
            }
            while (k.length < 64) k.push(0);
            var o_key_pad = [], i_key_pad = [];
            for (var i = 0; i < 64; i++) {
              o_key_pad.push(k[i] ^ 0x5c);
              i_key_pad.push(k[i] ^ 0x36);
            }
            var innerMsg = i_key_pad.concat(msgBytes);
            var innerWords = bytesToWords(innerMsg, innerMsg.length * 8);
            var innerHash = sha1Block(innerWords);
            var innerHashBytes = [];
            for (var i = 0; i < 5; i++) {
              for (var b = 3; b >= 0; b--) innerHashBytes.push((innerHash[i] >>> (b * 8)) & 255);
            }
            var outerMsg = o_key_pad.concat(innerHashBytes);
            var outerWords = bytesToWords(outerMsg, outerMsg.length * 8);
            var outerHash = sha1Block(outerWords);
            var out = [];
            for (var i = 0; i < 5; i++) {
              for (var b = 3; b >= 0; b--) out.push((outerHash[i] >>> (b * 8)) & 255);
            }
            return out;
          }

          function bytesToWords(bytes, bitLength) {
            var words = [];
            for (var i = 0; i < bytes.length; i++) {
              words[i >> 2] |= (bytes[i] & 255) << ((3 - i % 4) * 8);
            }
            words[bitLength >> 5] |= 0x80 << (24 - (bitLength % 32));
            var totalWords = (((bitLength + 64) >>> 9) << 4) + 16;
            while (words.length < totalWords) words.push(0);
            words[totalWords - 1] = bitLength & 0xFFFFFFFF;
            words[totalWords - 2] = Math.floor(bitLength / 0x100000000);
            return words;
          }

          function verifyTotp(base32Secret, userCode) {
            if (!base32Secret || !userCode) return false;
            var keyBytes = base32Decode(base32Secret);
            var nowSec = Math.floor(Date.now() / 1000);
            var step = Math.floor(nowSec / 30);
            for (var drift = -1; drift <= 1; drift++) {
              var t = step + drift;
              var msg = [0, 0, 0, 0, (t >>> 24) & 255, (t >>> 16) & 255, (t >>> 8) & 255, t & 255];
              var h = hmacSha1(keyBytes, msg);
              var offset = h[19] & 0x0f;
              var code = ((h[offset] & 0x7f) << 24 | (h[offset + 1] & 255) << 16 | (h[offset + 2] & 255) << 8 | (h[offset + 3] & 255)) % 1000000;
              var codeStr = ("000000" + code).slice(-6);
              if (codeStr === String(userCode).trim()) return true;
            }
            return false;
          }

          function b64Dec(str) {
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
            str = String(str).replace(/[^A-Za-z0-9\+\/\=]/g, "");
            var bytes = [];
            var idx = 0;
            while (idx < str.length) {
              var e1 = chars.indexOf(str.charAt(idx++));
              var e2 = chars.indexOf(str.charAt(idx++));
              var e3 = chars.indexOf(str.charAt(idx++));
              var e4 = chars.indexOf(str.charAt(idx++));
              var c1 = (e1 << 2) | (e2 >> 4);
              var c2 = ((e2 & 15) << 4) | (e3 >> 2);
              var c3 = ((e3 & 3) << 6) | e4;
              bytes.push(c1);
              if (e3 !== 64) bytes.push(c2);
              if (e4 !== 64) bytes.push(c3);
            }
            var out = "";
            var i = 0;
            while (i < bytes.length) {
              var b1 = bytes[i++];
              if (b1 < 128) out += String.fromCharCode(b1);
              else if (b1 > 191 && b1 < 224) { var b2 = bytes[i++]; out += String.fromCharCode(((b1 & 31) << 6) | (b2 & 63)); }
              else { var b2 = bytes[i++]; var b3 = bytes[i++]; out += String.fromCharCode(((b1 & 15) << 12) | ((b2 & 63) << 6) | (b3 & 63)); }
            }
            return out;
          }

          // --- Verification Logic ---
          try {
            var devResContent = context.getVariable("getDevUserRes.content");
            var devUserFound = false;
            var devData = null;
            if (devResContent) {
              try {
                devData = JSON.parse(devResContent);
                if (devData.email && (devData.status === "active" || !devData.status)) {
                  devUserFound = true;
                }
              } catch (e) {}
            }

            if (!devUserFound) {
              context.setVariable("auth_success", "false");
              context.setVariable("authorize_error", "access_denied");
              context.setVariable("authorize_error_description", "Invalid username or password.");
              context.setVariable("mfa_challenge_needed", "false");
              return;
            }

            var inputPassword = context.getVariable("request.formparam.password") || "";
            var storedHash = "";
            var storageType = context.getVariable("password_storage_type");

            if (storageType === "secret-manager") {
              var smRes = context.getVariable("getSecretRes.content");
              if (smRes) {
                try {
                  var smData = JSON.parse(smRes);
                  var b64Data = smData.payload && smData.payload.data;
                  if (b64Data) {
                    storedHash = b64Dec(b64Data).trim();
                  }
                } catch (smErr) {}
              }
            } else {
              storedHash = (context.getVariable("private.stored_password_hash") || "").trim();
            }

            if (!storedHash || storedHash.indexOf(":") === -1) {
              context.setVariable("auth_success", "false");
              context.setVariable("authorize_error", "access_denied");
              context.setVariable("authorize_error_description", "User credentials not found or uninitialized.");
              context.setVariable("mfa_challenge_needed", "false");
              return;
            }

            var parts = storedHash.split(":");
            var salt = parts[0];
            var expectedHash = parts[1];
            var computedHash = sha256(salt + ":" + inputPassword);

            if (computedHash !== expectedHash) {
              context.setVariable("auth_success", "false");
              context.setVariable("authorize_error", "access_denied");
              context.setVariable("authorize_error_description", "Invalid username or password.");
              context.setVariable("mfa_challenge_needed", "false");
              return;
            }

            // Check MFA requirement
            var systemMfa = context.getVariable("system_mfa_enabled") === "true";
            var userMfaSecret = "";
            var userMfaActive = false;

            if (devData.attributes && Array.isArray(devData.attributes)) {
              for (var a = 0; a < devData.attributes.length; a++) {
                if (devData.attributes[a].name === "mfa_secret") {
                  userMfaSecret = devData.attributes[a].value;
                }
                if (devData.attributes[a].name === "mfa_enabled" && devData.attributes[a].value === "true") {
                  userMfaActive = true;
                }
              }
            }

            var mfaRequired = systemMfa || userMfaActive;

            if (mfaRequired && userMfaSecret) {
              var mfaCode = (context.getVariable("request.formparam.mfa_code") || "").replace(/[^0-9]/g, "");
              if (!mfaCode) {
                context.setVariable("auth_success", "false");
                context.setVariable("mfa_challenge_needed", "true");
                context.setVariable("mfa_auth_email", devData.email);
                return;
              }
              if (!verifyTotp(userMfaSecret, mfaCode)) {
                context.setVariable("auth_success", "false");
                context.setVariable("mfa_challenge_needed", "true");
                context.setVariable("mfa_error_message", "Invalid authentication code. Please try again.");
                context.setVariable("mfa_auth_email", devData.email);
                return;
              }
            }

            // Password and MFA verified!
            function randHex(len) {
              var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
              var str = "";
              for (var i = 0; i < len; i++) str += chars.charAt(Math.floor(Math.random() * chars.length));
              return str;
            }

            var authCode = "ac_" + randHex(32);
            var nowSec = Math.floor(Date.now() / 1000);

            var codePayload = {
              "code": authCode,
              "client_id": context.getVariable("auth_client_id"),
              "redirect_uri": context.getVariable("auth_redirect_uri"),
              "scope": context.getVariable("auth_scope"),
              "code_challenge": context.getVariable("auth_code_challenge"),
              "code_challenge_method": context.getVariable("auth_code_challenge_method"),
              "user_id": devData.developerId || devData.email,
              "user_email": devData.email,
              "user_first_name": devData.firstName || "",
              "user_last_name": devData.lastName || "",
              "user_name": devData.userName || devData.email,
              "auth_time": nowSec,
              "issued_at": nowSec
            };

            context.setVariable("auth_generated_code", authCode);
            context.setVariable("auth_code_payload_data", JSON.stringify(codePayload));
            context.setVariable("auth_success", "true");
            context.setVariable("mfa_challenge_needed", "false");

            var redirectUri = context.getVariable("auth_redirect_uri");
            var state = context.getVariable("auth_state");
            var sep = redirectUri.indexOf("?") === -1 ? "?" : "&";
            var targetRedirect = redirectUri + sep + "code=" + encodeURIComponent(authCode);
            if (state) targetRedirect += "&state=" + encodeURIComponent(state);

            context.setVariable("auth_target_redirect_url", targetRedirect);

          } catch (err) {
            context.setVariable("auth_success", "false");
            context.setVariable("authorize_error", "server_error");
            context.setVariable("authorize_error_description", "Credential verification error: " + err);
            context.setVariable("mfa_challenge_needed", "false");
          }

          })();
  - name: AM-MFAChallengeForm
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-MFAChallengeForm
        IgnoreUnresolvedVariables: "true"
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: |
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Two-Factor Authentication | OpenID Connect IdP</title>
                <style>
                  :root { --primary: #3b82f6; --primary-hover: #2563eb; --bg: #0b0f19; --card: #111827; --border: #1f2937; --text: #f9fafb; --text-muted: #9ca3af; --input-bg: #1f2937; --danger: #ef4444; }
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
                  .container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 440px; padding: 36px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); text-align: center; }
                  .icon-wrap { width: 56px; height: 56px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 24px; }
                  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
                  p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
                  .error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
                  .form-group { margin-bottom: 20px; text-align: left; }
                  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
                  input[type="text"] { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 20px; letter-spacing: 0.3em; text-align: center; font-weight: 600; outline: none; }
                  input:focus { border-color: var(--primary); }
                  .btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
                  .btn:hover { background: var(--primary-hover); }
                  .cancel-link { display: inline-block; margin-top: 18px; color: var(--text-muted); font-size: 13px; text-decoration: none; }
                  .cancel-link:hover { color: var(--text); }
                </style>
              </head>
              <body>
                <div class="container">
                  <div class="icon-wrap">🔒</div>
                  <h1>Two-Factor Verification</h1>
                  <p>Enter the 6-digit verification code from your authenticator app for <strong>{mfa_auth_email}</strong>.</p>

                  <form action="/authorize" method="POST">
                    <input type="hidden" name="client_id" value="{auth_client_id}">
                    <input type="hidden" name="redirect_uri" value="{auth_redirect_uri}">
                    <input type="hidden" name="response_type" value="{auth_response_type}">
                    <input type="hidden" name="scope" value="{auth_scope}">
                    <input type="hidden" name="state" value="{auth_state}">
                    <input type="hidden" name="code_challenge" value="{auth_code_challenge}">
                    <input type="hidden" name="code_challenge_method" value="{auth_code_challenge_method}">
                    <input type="hidden" name="username" value="{auth_user_email}">
                    <input type="hidden" name="password" value="{request.formparam.password}">

                    <div class="form-group">
                      <label for="mfa_code">Authenticator Code</label>
                      <input type="text" id="mfa_code" name="mfa_code" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456" required autofocus>
                    </div>

                    <button type="submit" class="btn">Verify & Complete Sign In</button>
                  </form>
                  <a href="/authorize?client_id={auth_client_id}&redirect_uri={auth_redirect_uri}&response_type={auth_response_type}&scope={auth_scope}&state={auth_state}&code_challenge={auth_code_challenge}&code_challenge_method={auth_code_challenge_method}" class="cancel-link">Cancel</a>
                </div>
                <script>
                  (function() {
                    var mfaInput = document.getElementById('mfa_code');
                    if (mfaInput) {
                      var form = mfaInput.closest('form');
                      if (form) {
                        form.addEventListener('submit', function() {
                          mfaInput.value = mfaInput.value.replace(/[^0-9]/g, '');
                        });
                      }
                    }
                  })();
                </script>
              </body>
              </html>

  - name: PC-StoreCode
    type: PopulateCache
    content:
      PopulateCache:
        metadata:
          name: PC-StoreCode
        CacheKey:
          Prefix: OAuth21-AuthCode
          KeyFragment:
            metadata:
              ref: auth_generated_code
        ExpirySettings:
          TimeoutInSec: "600"
        Source: auth_code_payload_data

  - name: AM-AuthorizeRedirect
