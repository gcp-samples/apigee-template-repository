                  <span class="badge">OpenID Connect IdP</span>
                  <h1>Create Account</h1>
                  <p>Register as a new user to access applications across the identity ecosystem.</p>

                  <form action="/register-user" method="POST">
                    <input type="hidden" name="client_id" value="{reg_client_id}">
                    <input type="hidden" name="redirect_uri" value="{reg_redirect_uri}">
