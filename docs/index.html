<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Apigee Template &amp; Feature Documentation</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Inline script to prevent FOUC (Flash of Unstyled Content)
    (function() {
      const savedTheme = localStorage.getItem("apigee-docs-theme");
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = savedTheme || (systemDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner container">
      <div class="brand">
        <a href="index.html" class="brand-link">
          <span class="brand-badge">AFT</span>
          <span class="brand-title">Apigee Templates &amp; Features</span>
        </a>
      </div>

      <div class="header-controls">
        <div class="selector-wrapper">
          <label for="catalog-select" class="visually-hidden">Select Definition</label>
          <select id="catalog-select" class="catalog-select">
            <option value="" disabled selected>Select Template or Feature...</option>
            <optgroup label="Stable Templates">
              <option value="templates/REST-AI-Interactions.yaml">REST-AI-Interactions.yaml</option>
              <option value="templates/REST-AI-GenerateContent.yaml">REST-AI-GenerateContent.yaml</option>
              <option value="templates/REST-AI-Messages.yaml">REST-AI-Messages.yaml</option>
              <option value="templates/REST-AI-Completions.yaml">REST-AI-Completions.yaml</option>
              <option value="templates/REST-AI-Embeddings.yaml">REST-AI-Embeddings.yaml</option>
              <option value="templates/REST-AI-Images.yaml">REST-AI-Images.yaml</option>
            </optgroup>
            <optgroup label="Stable Features">
              <option value="features/ai-endpoint-interactions.yaml">ai-endpoint-interactions.yaml</option>
              <option value="features/ai-endpoint-content.yaml">ai-endpoint-content.yaml</option>
              <option value="features/ai-endpoint-messages.yaml">ai-endpoint-messages.yaml</option>
              <option value="features/ai-endpoint-completions.yaml">ai-endpoint-completions.yaml</option>
              <option value="features/ai-endpoint-embeddings.yaml">ai-endpoint-embeddings.yaml</option>
              <option value="features/ai-endpoint-images-generations.yaml">ai-endpoint-images-generations.yaml</option>
              <option value="features/ai-target-gemini.yaml">ai-target-gemini.yaml</option>
              <option value="features/ai-target-googlecloud.yaml">ai-target-googlecloud.yaml</option>
              <option value="features/ai-target-openai.yaml">ai-target-openai.yaml</option>
              <option value="features/ai-model-preprocess.yaml">ai-model-preprocess.yaml</option>
              <option value="features/ai-model-postprocess.yaml">ai-model-postprocess.yaml</option>
              <option value="features/ai-model-failover.yaml">ai-model-failover.yaml</option>
              <option value="features/auth-apikey-verify.yaml">auth-apikey-verify.yaml</option>
              <option value="features/auth-group-lookup.yaml">auth-group-lookup.yaml</option>
              <option value="features/auth-oauth-server.yaml">auth-oauth-server.yaml</option>
              <option value="features/auth-oauth-verify.yaml">auth-oauth-verify.yaml</option>
              <option value="features/ai-security-modelarmor.yaml">ai-security-modelarmor.yaml</option>
              <option value="features/ai-target-anthropic.yaml">ai-target-anthropic.yaml</option>
              <option value="features/ai-target-googlecloudeu.yaml">ai-target-googlecloudeu.yaml</option>
              <option value="features/ai-token-quota.yaml">ai-token-quota.yaml</option>
              <option value="features/data-proxy-firestore.yaml">data-proxy-firestore.yaml</option>
              <option value="features/security-anonymization-presidio.yaml">security-anonymization-presidio.yaml</option>
              <option value="features/security-anonymization-sdp.yaml">security-anonymization-sdp.yaml</option>
            </optgroup>
          </select>
        </div>

        <button id="theme-toggle" class="btn-icon" aria-label="Toggle light/dark theme" title="Toggle theme">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="custom-url-bar container">
    <div class="input-group">
      <input type="text" id="custom-url-input" placeholder="Enter relative path (e.g. features/ai-model-preprocess.yaml) or full URL..." spellcheck="false" autocomplete="off">
      <button id="load-url-btn" class="btn-primary">Load</button>
    </div>
  </div>

  <main id="app-container" class="container">
    <div id="loading-state" class="state-container">
      <div class="spinner"></div>
      <p class="state-text">Loading YAML definition...</p>
    </div>

    <div id="error-state" class="state-container hidden">
      <div class="error-badge">Error</div>
      <h2 id="error-title">Failed to load definition</h2>
      <p id="error-message" class="state-text"></p>
      <div class="error-actions">
        <button id="retry-btn" class="btn-secondary">Retry</button>
        <button id="reset-btn" class="btn-secondary">Load Default</button>
      </div>
    </div>

    <article id="doc-content" class="doc-content hidden">
      <!-- Dynamic documentation rendered here -->
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Apigee Template Repository &bull; Open-source under Apache 2.0</p>
      <div class="footer-links">
        <a href="https://github.com/gcp-samples/apigee-template-repository" target="_blank" rel="noopener">GitHub Repository</a>
        <a href="https://github.com/apigee/apigee-templater" target="_blank" rel="noopener">Apigee Templater (aft)</a>
      </div>
    </div>
  </footer>

  <script src="js-yaml.min.js"></script>
  <script>
    if (typeof jsyaml === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"><\/script>');
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
